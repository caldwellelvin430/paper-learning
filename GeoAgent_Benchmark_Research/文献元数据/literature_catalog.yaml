  translation_scope_evidence: '# EarthSE：评价大型语言模型地球科学探索能力的基准


    > **翻译范围说明**：摘要为完整中文翻译；正文为主要章节译述，尚未覆盖原文及附录的全部段落。完整英语原文与截图另附。


    ## 原文摘要｜完整中文翻译


    大语言模型（Large Language Models，LLMs）的进步推动了人们对科学应用的兴趣，也使得建立地球科学等特定领域评测基准成为必要。现有基准要么侧重一般科学问题，缺乏地球科学的领域特性；要么只覆盖孤立的子领域，缺少整体性的评价。此外，当前基准通常忽视模型开展开放式科学探索的能力。本文提出一个全面、专业的地球科学
    Benchmark，用于评价大语言模型在这一领域从基础到高级阶段的科学探索能力。基于十万篇研究论文构建的语料库，作者首先建立两个问答数据集：Earth-Iron 具有广泛的问题覆盖面，服务于全面评价；Earth-Silver
    则具有更高的难度，用于测量专业深度。这些数据集覆盖地球五大圈层、114 个学科方向和 11 类任务，考察开展科学探索所需的基础知识能力。更重要的是，作者提出 Earth-Gold，并设计新的评价指标：该数据集由开放式、多轮对话构成，专门评价模型在科学探索中的深度与多样性，任务包括方法归纳、局限性分析和概念提出。对
    11 个主流大语言模型的大量实验显示，当前模型在不同地球科学领域和任务上仍有明显局限，科学探索能力还有较大提升空间。数据发布于论文给出的 Hugging Face 平台。


    ## 研究动机｜节译


    已有科学 Benchmark 常采用可判定正误的封闭式问答，但地球科学问题同时涉及大气、水文、岩石圈、冰冻圈和生物圈等学科。能够正确解释术语或完成计算，不意味着模型可以归纳科学方法、识别论文的局限并提出后续研究问题。作者因此将**基础知识测评**与**开放式科学探索测评**分开设计。


    ## 三层数据集与构建方式｜重点译述


    - **Earth-Iron**：着重覆盖广度，面向不同地球科学圈层和多种任务类别建立较大规模的问答集合。

    - **Earth-Silver**：选择难度更高、专业性更强的材料，评价模型能否理解高阶地球科学概念和推理任务。

    - **Earth-Gold**：围绕论文内容构建多轮开放式对话，考察方法归纳、研究局限性辨析、概念提出等科学探索行为，而不是只检查单一标准答案。


    论文从十余万篇论文中进行领域与质量筛选，结合文献元数据、引用情况、自动化构造流程和人工审核。地球五大圈层与 114 个研究方向构成分类基础；不同数据集分别服务于知识广度、专业深度和探索能力。


    ## 评测机制｜重点译述


    EarthSE 的评测设计提醒我们：**测量对象发生变化时，评分协议也必须改变**。封闭式 QA 可采用答案匹配或正确性检验；开放式科学探索具有不同的合理路径，需要评价探索的质量、深度和多样'
