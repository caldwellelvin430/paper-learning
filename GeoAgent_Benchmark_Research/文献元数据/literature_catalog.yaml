  translation_scope_evidence: '# GeoMMBench 与 GeoMMAgent：面向地学与遥感的专家级多模态智能


    > **翻译范围说明**：摘要全文翻译、正文核心部分译述；英文全文、原图与原始 PDF 保留，可用于逐段补译。


    ## 原文摘要｜完整中文翻译


    多模态大语言模型（Multimodal Large Language Models，MLLMs）的最新进展推动了面向特定领域的人工智能发展，但地球科学与遥感领域的进步仍受到若干特有挑战的制约：学科知识范围广、传感器模态异构以及任务类型分散。为弥补这些不足，作者提出
    GeoMMBench，一项覆盖多样遥感学科、传感器和任务的综合性多模态问答基准，能够比以往基准开展更广泛、更加严格的评价。利用 GeoMMBench，作者评估了 36 个开源及专有大语言模型，发现它们在领域知识、感知锚定和推理能力方面存在系统性的不足；这些能力对专家级地理空间解释至关重要。除评价之外，作者还提出
    GeoMMAgent：一种通过领域专用遥感模型和工具，策略性地整合检索、感知与推理的多智能体框架。大量实验表明，GeoMMAgent 明显优于独立使用的语言模型，说明工具增强智能体对于动态解决复杂地学与遥感问题具有重要价值。


    ## Benchmark 构建与任务｜重点译述


    GeoMMBench 包含 **1,053 道专家级、基于图像的多项选择题**。问题覆盖遥感、摄影测量、地理信息系统和全球导航卫星系统等领域，涉及光学影像、SAR、多光谱、高光谱、LiDAR 和数字高程模型等传感器或数据类型。问题不仅要求识别影像对象，也涉及专业术语、数据预处理、空间关系和高层地学应用。


    作者强调专家知识与人工审校的重要性。任务由领域专家共同设计，经过文本推断偏差和不准确样本的检查：对于仅凭文字表述就能猜出答案、没有真正依赖图像信息的题目，需要修改或剔除。


    ## GeoMMAgent 的基本机制｜重点译述


    GeoMMAgent 将复杂问题分解到**检索—感知—推理**三个功能阶段，使通用语言模型能够借助知识检索与领域遥感工具完成专家级问题。它是一种与 Benchmark 配套的 Agent 方法，但 Benchmark
    本身主要通过专家构建的图像多项选择题评价模型，而不是只考察工具调用轨迹。


    ## 实验与评价｜重点译述


    论文对 36 个模型进行比较，利用专家标注的答案评价表现；此外，使用 GeoMMAgent 说明多 Agent 协同对提升复杂地学任务解决能力的贡献。与执行型 GIS Benchmark 不同，此处最关键的评价对象是**专业知识、视觉感知与推理输出**，需要与
    GIS 工具真实执行结果区分。


