    **原论文**：GeoCode-GPT_A_large_language_model_for_geospatial_code_generation

    **作者**：Shuyang Hou、Zhangxiao Shen、Anqi Zhao、Jianyuan Liang、Zhipeng Gui、Xuefeng Guan、Rui Li、Huayi Wu

    **PDF 页数**：15


    > 阅读说明：本文件提供按照原文结构整理的中文学术译述（涵盖研究背景、方法、评价、结果、附录说明），不是逐词、逐句覆盖全部英文的严格全文翻译。原 PDF 全部页面的英语文字、图表和参考文献保留于 `英文原文_逐页.md`、`original.pdf`
    和 `source_pages/`。代码、模型名称、API 和学术引用保留原样，详情见 `QA_逐页核查.md`。


    ## 论文摘要（中文译文）


    随着地球科学领域对时空数据和建模任务的需求不断增长，地理空间代码生成技术已成为提高生产效率的重要因素。尽管大语言模型（LLM）在代码生成方面展现出潜力，但由于缺乏领域专用知识与代码语料，它们在地理空间代码生成中经常出现拒绝生成代码或产生幻觉等问题。为此，本文构建并开源
    GeoCode-PT 预训练语料库、GeoCode-SFT 监督微调语料库和 GeoCode-Eval 评价数据集。在此基础上，利用 QLoRA 和 LoRA 分别开展预训练与微调，从 Code Llama-7B 构建了面向地理空间代码生成的
    GeoCode-GPT-7B。研究还提出结合选项匹配、专家核验和提示工程评分的综合评价框架，并使用 GeoCode-Eval 进行系统测试。实验表明，GeoCode-GPT 在多项任务上显著超越现有模型：多项选择任务的准确率相较对比模型提高
    9.1—32.1 个百分点；代码摘要在完整性、准确性和可读性方面提高 1.7—25.4 分；代码生成在准确性、可读性和可执行性方面提高 1.2—25.1 分。研究证明，针对地理空间代码构建专用语料并进行领域微调，可以有效改善模型表现，拓展地理空间大模型的应用边界。


