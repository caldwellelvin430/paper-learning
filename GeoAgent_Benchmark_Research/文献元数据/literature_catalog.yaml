  translation_scope_evidence: '# 遥感中的智能体人工智能：基础、分类体系与新兴系统


    > **翻译范围说明**：本文件包含原文摘要的完整中文翻译，以及研究内容的重点章节译述；**不等同于论文全部 14 页的逐段全文译文**。所有原文、参考文献及图表均另附，可逐页核对。


    ## 原文摘要｜完整中文翻译


    地球观测（Earth Observation，EO）分析的范式正在从静态深度学习模型转向自主智能体人工智能（Agentic AI）。虽然近年来的视觉基础模型（Vision Foundation Models）和多模态大语言模型（Multimodal
    Large Language Models，MLLMs）推动了表征学习的发展，但这些模型通常缺乏复杂地理空间工作流所需要的顺序规划能力和主动工具编排能力。本文对遥感领域的智能体人工智能进行全面综述，提出一套统一的分类体系，以区分单智能体辅助系统（single-agent
    copilots）和多智能体系统（multi-agent systems），并分析规划机制、检索增强生成（Retrieval-Augmented Generation，RAG）以及记忆结构等架构基础。此外，本文梳理了正在出现的新型评测基准：这些基准推动评价重点从像素级准确率转向具有轨迹感知能力的推理正确性。通过批判性审视地理空间锚定（grounding）、安全性与智能体编排方面的局限，本文提出了构建稳健、自主地理空间智能系统的战略性发展路线。


    ## 引言与综述定位｜节译


    地球观测数据来源广泛，既有卫星和无人机获取的可见光影像，也有合成孔径雷达、红外、高光谱和激光雷达数据。传统遥感深度学习模型在场景分类、变化检测、目标定位和异常检测等任务上已有成熟应用，但它们通常围绕事先确定的输入、目标和处理流程进行预测。通用视觉语言模型可以把图像与自然语言连接起来，却未必能够在空间尺度、传感器特性及连续的工具调用约束下完成自主分析。


    因此，智能体系统的核心能力不仅在于“看懂影像”，还在于将自然语言问题转化为有逻辑顺序、可以调用外部工具且能够利用反馈进行调整的分析过程。论文强调，研究对象应从单一模型的识别能力，扩展至包含工具、记忆、检索、规划和执行环境的完整系统。


    ## 主要分类与系统组成｜重点译述


    论文从体系结构角度区分**单智能体 Copilot**与**多智能体编排系统**。前者通常由一个中心智能体使用 GIS 或遥感工具完成任务；后者进一步划分规划、执行、感知、检索等角色，使各智能体可以协作处理复杂工作流。系统层面涉及外部知识检索、RAG、工具/API
    接口、短期和长期记忆，以及能够支撑实际环境交互的编排机制。论文并非提出一个全新的可执行 Benchmark，而是对领域中已有系统、相关数据集和评价思路进行分类比较。


