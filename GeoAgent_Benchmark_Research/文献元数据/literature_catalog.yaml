  translation_scope_evidence: "# AgentSuite：利用基于组件的基准审计流水线实现更可靠的智能体评估\n\n**原题**：*AgentSuite: Toward More Reliable\
    \ Agent Evaluation with a Component-Based Benchmark Auditing Pipeline*  \n**作者**：Hyewon Suh、Binfei Ji、Seojune\
    \ Lee、Rishi Khare、Basit Khan、Hyunjun Kim、Tianyi Zhang、Venkat Krishna Srinivasan、Peter Belcak、Shizhe Diao、Pavlo\
    \ Molchanov、Yingyan (Celine) Lin、Zhen Dong  \n**机构**：佐治亚理工学院；NVIDIA；加州大学圣巴巴拉分校  \n**会议**：第 43 届国际机器学习大会（ICML\
    \ 2026），PMLR 第 306 卷，首尔  \n**通讯作者**：Zhen Dong（zhend@nvidia.com；zhend@ucsb.edu）  \n**项目**：https://github.com/Agent-Suite/AgentSuite\n\
    \n> **阅读与排版说明**：忠实保留论文中的组件缩写、评估公式、代码与接口、表中数值。引用文献的书目元数据以原文为准。所有图表均为原 PDF 裁切，必要时参见 `source_pages/` 中的 20 张逐页原稿截图及同目录的完整英文提取稿。\n\
    \n## 摘要\n\n大语言模型（LLM）智能体能否得到可靠评价，在很大程度上取决于基准的**有效性**（benchmark validity）。然而，现代智能体基准常含有由用户指令、环境、工具、真实值轨迹和评估协议之间的交互引起的隐蔽缺陷。这些问题将模型自身错误与基准构造缺陷混淆，削弱了基于排行榜的模型比较的可信度。\n\
    \n本文提出 **COBA（COmponent-based Benchmark Auditing，基于组件的基准审计）**，一种自动化诊断与过滤智能体基准有效性问题的流水线。COBA 将智能体任务拆解为四个标准化组件：**用户（User）**、**环境（Environment）**、**真实值（Ground\
    \ Truth）**和**评估（Evaluation）**，并结合基于规则的检测器与分类体系指导的 LLM 判断，将组件级问题分类体系落实为可执行的审计机制。在六个广泛使用的智能体基准上，COBA 与专家判断高度一致，F1\
    \ 分数达到 **0.791–0.874**。它补充了对 τ²-bench 的人工核查，发现因基准复杂性而被人工遗漏的问题，并且只需极少调整即可泛化到此前未见过的基准。研究表明，基准缺陷广泛存在，并对评价结果产生实质影响，因此组件化审计为更可靠、可解释的"
