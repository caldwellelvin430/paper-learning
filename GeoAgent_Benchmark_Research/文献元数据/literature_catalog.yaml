  translation_scope_evidence: "# 分割一切（Segment Anything）\n\n> **作者**：Alexander Kirillov、Eric Mintun、Nikhila Ravi、Hanzi\
    \ Mao、Chloe Rolland、Laura Gustafson、Tete Xiao、Spencer Whitehead、Alexander C. Berg、Wan-Yen Lo、Piotr Dollár、Ross\
    \ Girshick  \n> **机构**：Meta AI Research，FAIR  \n> **论文**：ICCV 2023 开放获取版本。原稿脚注：作者中设有项目负责人、共同第一作者、同等贡献作者及方向负责人。\
    \  \n> **说明**：正文按原论文翻译，模型、数据集及评估指标采用约定的英文术语。参考文献保留原始英文书目，详见文末及英文逐页提取稿。\n\n![图 1 Segment Anything 的任务、模型和数据](./images/figure-01-p01.png)\n\
    \n*图 1：构建图像分割基础模型的三个相互关联部分：（a）可提示分割任务；（b）支持数据标注与零样本迁移的 SAM 模型；（c）用于收集超过十亿个掩码的 SA-1B 数据集的数据引擎。（原稿第 1 页）*\n\n\
    ## 摘要（第 1 页）\n\n我们提出 **Segment Anything（SA，分割一切）**项目，其中包含一项新的图像分割任务、一个模型以及一个数据集。通过将高效模型引入数据收集循环，我们建立了迄今规模最大的分割数据集，其中包含约\
    \ **1100 万张**经授权、尊重隐私的图像，以及超过 **10 亿个分割掩码**。该模型被设计、训练为可通过提示控制，使其能够以零样本方式迁移至新的图像分布和任务。我们针对多种任务评估了该模型的能力，发现其零样本性能令人印象深刻，经常能够与已有完全监督方法竞争，甚至超越它们。我们发布\
    \ **Segment Anything Model（SAM）** 及相应的 **SA-1B** 数据集（约 10 亿个掩码、1100 万张图像），以推动计算机视觉基础模型的研究。项目网址为 https://segment-anything.com\
    \ ，建议阅读论文完整版本 https://arxiv.org/abs/2304.02643 。\n\n## 1 引言（第 1–2 页）\n\n在网络规模语料上预训练的大语言模型，凭借强大的零样本和少样本泛化能力，正在深刻改变自然语言处理（NLP）[10]。这类**基础模型（foundation\
    \ models）**[8]能够泛化到训练期间未见过的任务和数据分布。通常通过**提示工程（prompt engineering）**实现这种能力：设计人工编写的文本提示，促使语言模型针对给定任务产生有效的文本回答。在海量网络文本上扩展模型规模并训练之后，其零样本和少样本表现"
