  translation_scope_evidence: "# GeoAnalystBench：评估大语言模型空间分析工作流与代码生成能力的 GeoAI 基准\n\n**作者：** Qianheng Zhang, Song\
    \ Gao, Chen Wei, Yibo Zhao, Ying Nie, Ziru Chen, Shijie Chen, Yu Su, Huan Sun  \n**机构：** 美国威斯康星大学麦迪逊分校地理系 GeoDS\
    \ Lab；俄亥俄州立大学计算机科学与工程系  \n**期刊：** *Transactions in GIS*，2025，29:e70135  \n**DOI：** https://doi.org/10.1111/tgis.70135\
    \  \n**收稿／修订／录用：** 2025-03-04／2025-08-25／2025-09-29  \n**通讯作者：** Song Gao（song.gao@wisc.edu）  \n**资助：** 美国国家科学基金会，项目号\
    \ 2112606  \n**开源数据：** https://github.com/GeoDS/GeoAnalystBench\n\n> 术语采用“空间分析／地理处理（spatial analysis/geoprocessing）”“有效率（valid\
    \ rate, VR）”“工作流长度平均绝对偏差（MAD）”“文本相似度（TS）”“领域知识（DK）”“数据集描述（DD）”“代码 BLEU（CodeBLEU）”等标准写法。此处保留英文论文原始数字、模型版本、代码、公式及图表，供交叉核对。\n\
    \n## 摘要\n\n大语言模型（LLM）的进步推动了自动化地理空间分析和 GIS 工作流的研究，但模型的实际能力仍不确定。作者主张，在宣称实现全面 GIS 自动化之前，应当先用明确定义的地理处理任务进行严格评价。为此，本文提出\
    \ **GeoAnalystBench**：一个由 GIS 专家验证的基准，包含从真实世界地理空间问题提炼的 **50 项 Python 任务**。每个任务配有最低限度的交付成果，评估内容包括工作流有效性、结构一致性、语义相似度和代码质量（CodeBLEU）。研究测试了闭源与开源模型，发现显著差距：ChatGPT-4o-mini\
    \ 等商业模型的工作流有效率可达 **95%**，CodeBLEU 为 **0.39**；DeepSeek-R1-7B 等较小开源模型经常生成不完整或不一致的工作流（有效率 **48.5%**，CodeBLEU **0.272**）。深度空间推理任务，例如空间关系判断和最优选址，对所有模型都最具挑战性。结果既展示了现阶段\
    \ LLM 在 GIS 自动化方面的潜力与局限，也为包含人类专家参与的 GeoAI 研究提供了可复现的评价框架。\n\n**关键词：** 基准测试；GeoAI；语言智能体；大语言模型；空间分析。\n\n## 1 引言\n\
    \n生成式"
