  translation_scope_evidence: '# OpenEarthAgent：工具增强地理空间智能体的统一框架


    **原文题目：** OpenEarthAgent: A Unified Framework for Tool-Augmented Geospatial Agents


    **原始 PDF：** [原始论文](./原始论文.pdf)（共 39 页）


    > **翻译覆盖声明（请先阅读）**：本文件提供**摘要完整中文翻译**及主要研究章节的**中文学术译述**，不等同于逐字逐句的全文译本。为避免遗漏资料，原 PDF 全部页面的英文文字与附录、参考文献均已收录在 `英文原文_逐页.md`
    和 `英文全文_保留版面.txt`，图、表另见 `图表索引.md`。不可把本文档当作全部正文及附录均已翻译的材料。


    ---


    ## 摘要（完整中文翻译）


    多模态推理的发展，使智能体能够理解影像、关联语言信息并执行结构化分析任务；但将这些能力拓展至遥感仍然困难，因为模型必须处理空间尺度、地理结构和多光谱指数，同时维持一致的多步骤逻辑。为解决这一问题，本文提出 OpenEarthAgent：一个面向工具增强地理空间推理的统一框架，通过卫星影像、自然语言查询和结构化推理轨迹进行训练。OpenEarthAgent
    不仅提供评测基准，还构建了集统一可执行工具注册表与轨迹策略学习于一体的智能体架构。框架将不同来源的视觉、光谱、GIS 和带地理参考的栅格操作规范化为一致的可调用接口，使其能够模块化编排和确定性执行。训练采用结构化推理轨迹监督微调，并使用确定性重放验证检查可执行性和空间正确性。配套数据集包含
    14,538 个训练样本和 1,169 个评测样本，累计超过 10.7 万个推理步骤，覆盖城市、环境、灾害和基础设施等应用场景，并融合 GIS 操作以及 NDVI、NBR、NDBI 等指数分析。基于显式推理轨迹的模型表现出结构化的决策过程、更稳定的空间理解能力和可解释的工具使用行为，在强基线之上持续取得改进，并与近期部分开源、闭源模型表现接近。


    ## 主要研究章节（中文学术译述）



    ### 研究动机


    传统视觉基础模型和遥感视觉语言模型擅长静态识别与图文理解，但缺乏将复杂任务分解为一系列可执行地理空间操作的能力。真实业务任务可能需要读取 GeoTIFF 的空间范围、创建矢量边界、添加 POI、测距、叠加可视化并标注结果。若工具选错、参数类型不匹配或执行顺序颠倒，智能体即使写出了合理的文字计划，也可能在运行中失败。


    ### 数据构建与监督信号


    研究提供统一组织的影像—问题—推理轨迹样本。训练集 14,538 条，评测集 1,169 条，总计超过 107,000 个推理步骤。轨迹连接自然语言问题、具体工具调用、中间状态及最终输出，涉及城市基础设施、环境、灾害、土地利用和交通等场景。作者不仅提供答案，也将可执行的过程作'
