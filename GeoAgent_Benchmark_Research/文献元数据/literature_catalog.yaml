  translation_scope_evidence: '# GIS Copilot：面向空间分析的自主 GIS 智能体


    **原论文**：GIS_Copilot_towards_an_autonomous_GIS_agent_for_spatial_analysis

    **作者**：Temitope Akinboyewa、Zhenlong Li、Huan Ning、M. Naser Lessani

    **PDF 页数**：24


    > 阅读说明：本文件提供按照原文结构整理的中文学术译述（涵盖研究背景、方法、评价、结果、附录说明），不是逐词、逐句覆盖全部英文的严格全文翻译。原 PDF 全部页面的英语文字、图表和参考文献保留于 `英文原文_逐页.md`、`original.pdf`
    和 `source_pages/`。代码、模型名称、API 和学术引用保留原样，详情见 `QA_逐页核查.md`。


    ## 论文摘要（中文译文）


    生成式人工智能（AI），特别是大语言模型（LLM）的近期进展，为空间分析带来了可观的应用前景，但其与成熟 GIS 平台的融合仍缺乏深入研究。本文提出一种将 LLM 嵌入现有 GIS 平台的框架，并以 QGIS 为案例。该框架利用
    LLM 的推理与编程能力，结合包含关键 GIS 工具及其参数文档的知识体系，自主生成空间分析工作流，同时纳入 GeoPandas 等外部工具以增强地理处理能力。基于此，作者开发了 GIS Copilot，使用户能够使用自然语言与
    QGIS 交互。研究测试了超过 100 项复杂度不同的任务，包括基础任务（单工具/图层）、中级任务（有操作指导的多步骤任务）和高级任务（无明确步骤指导的多步骤任务）。结果显示，该系统在基础与中级任务上取得较高成功率，但对高级任务的全自主执行仍面临挑战。GIS
    Copilot 通过减少非专业用户所需的地理空间知识，为构建自主 GIS 和简化空间分析工作流提供了可行路径；不过它尚未实现完全自主。


