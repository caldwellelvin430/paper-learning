    ## 1. 引言（上）

    大语言模型在复杂推理任务中取得很大进展，但解决数学、常识及符号推理问题往往需要生成一系列正确的中间步骤。少样本 CoT 通过人工示范推理过程提高准确率；Zero-shot-CoT 则只在问题后添加一句“让我们一步一步思考”，从而避免逐题准备示范'
