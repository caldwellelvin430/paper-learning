  translation_scope_evidence: "# 生成式智能体：人类行为的交互式拟真模拟\n\n> **原题**：Generative Agents: Interactive Simulacra of Human\
    \ Behavior  \n> **作者**：Joon Sung Park、Joseph C. O’Brien、Carrie J. Cai、Meredith Ringel Morris、Percy Liang、Michael\
    \ S. Bernstein  \n> **机构**：斯坦福大学、Google Research、Google DeepMind  \n> **出处**：UIST 2023，22 页；DOI：10.1145/3586183.3606763\
    \  \n> **译文说明**：遵循原论文的章、节、图号结构。人物姓名、系统名称、算法术语及引文编号保留原写法；代码和参考文献书目保持原文。完整逐页英文提取请见 `英文原文_逐页提取.md`，每一页原貌见 `source_pages/`。\n\
    \n![图1：25个生成式智能体生活的小镇环境](./images/figure-01.png)\n\n**图1　生成式智能体是可用于交互应用的人类行为可信模拟体。** 作者在一个类似《模拟人生》（The Sims）的沙盒环境中放置了25个智能体。用户能够观察并干预它们制定每日计划、传播消息、建立关系与协调群体活动的过程。\n\
    \n## 摘要\n\n可信的人类行为代理能够支持多种交互应用，包括沉浸式环境、人际沟通排练场景以及原型设计工具。本文提出**生成式智能体（generative agents）**：一种能够模拟可信人类行为的计算软件智能体。这些智能体会起床、做早饭、上班；艺术家会绘画，作家会写作；它们能够形成看法、注意到他人、主动交谈，记住并反思过去的日子，还会规划下一天的活动。\n\
    \n为实现此类智能体，作者提出一种扩展大语言模型的架构：以自然语言存储智能体经验的完整记录，随时间将这些记忆综合为更高层次的反思，并在规划行为时动态检索。作者将25个生成式智能体置于受《模拟人生》启发的交互式沙盒小镇，使最终用户能通过自然语言与它们互动。评估表明，智能体能够产生可信的个体行为及涌现式社会行为。例如，用户只向一个智能体提出“想举办情人节聚会”的念头，智能体便在接下来两天自主传播邀请、结识新朋友、约伴同行，并在正确的时间协调出席聚会。\n\
    \n消融实验表明，智能体架构中的**观察（observation）、规划（planning）和反思（reflection）**对行为可信度均具有关键作用。通过将大语言模型与可计算的交互式智能体融合，本文为实现可信的人类行为模拟提出了新的架构和交互设计模式。\n\
    \n**ACM CCS 分类**：以人为中心的计算——交互系统与工具；计算方法——自然语言处理。  \n**关键词**：人机交互；智能体；生成式人工智能；大语言模型。\n"
