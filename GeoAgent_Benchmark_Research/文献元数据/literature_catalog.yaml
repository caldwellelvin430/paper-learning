  translation_scope_evidence: "# GeoAgentBench：面向空间分析工具增强型智能体的动态执行基准\n\n**原题**：*GeoAgentBench: A Dynamic Execution\
    \ Benchmark for Tool-Augmented Agents in Spatial Analysis*  \n**作者**：Bo Yu、Cheng Yang、Dongyang Hou（通讯作者）、Chengfu\
    \ Liu、Jiayao Liu、Chi Wang、Zhiming Zhang、Haifeng Li、Wentao Yang  \n**机构**：中南大学地球科学与信息物理学院；湖南科技大学地球科学与空间信息工程学院\
    \  \n**版本**：arXiv:2604.13888v1，2026-04-15（预印本）  \n**代码与数据**：https://github.com/geox-lab/GABench\n\n> **译文说明**：本文件按论文原有章节组织，保留\
    \ GIS 算法名、基准名、工具函数名、参数符号和引用标识。图表为从原始 PDF 直接裁切的图像。论文的逐页英文提取、全部 20 页原稿图像分别见同目录的英文 Markdown 和 `source_pages/`。原文中的数学公式及其原始版式同时可在对应页图像中核对。\n\
    \n## 摘要\n\n将大语言模型（Large Language Models，LLMs）引入地理信息系统（Geographic Information Systems，GIS），标志着空间分析向自主化迈进的范式转变。然而，由于地理空间工作流具有复杂、多步骤的特性，评估此类基于\
    \ LLM 的智能体仍然面临困难。现有基准主要依赖静态文本或代码匹配，忽视了动态运行时反馈以及空间分析输出的多模态性质。为弥补这一缺口，我们提出 GeoAgentBench（GABench）：一种专门面向工具增强型\
    \ GIS 智能体的动态、交互式评测基准。\n\nGABench 提供集成 **117 个原子 GIS 工具**的真实执行沙箱，覆盖 **6 个核心 GIS 领域中的 53 项典型空间分析任务**。考虑到在动态 GIS\
    \ 环境中，精确的参数配置是决定执行成功与否的首要因素，我们设计了**参数执行准确率**（Parameter Execution Accuracy，PEA），采用“**最后一次尝试对齐**”（Last-Attempt\
    \ Alignment）策略，量化智能体隐式参数推断的准确程度。同时，提出基于**视觉—语言模型**（Vision-Language Model，VLM）的验证方法，以评估数据空间准确性及地图制图风格遵循程度。\n\n\
    此外，为应对参数不一致和运行时异常导致的频繁任务失败，我们提出一种模拟专家认知工作流的新型智能体架构——**Plan-and-React（规划—反应）**，通过分离全局编排和逐"
