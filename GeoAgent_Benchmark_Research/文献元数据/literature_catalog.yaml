    ## 摘要（完整中文翻译）


    遥感视觉语言模型（RS-VLM）已经推动地球观测分析向视觉理解和指令遵循发展，但仍难以满足业务化地理空间情报分析的要求；后者必须具有以工具执行为依据的空间推理能力，并形成结构化、具有证据支撑的决策。本文提出 GeoDisaster：一个面向灾害业务化地理空间推理的基准，涵盖
    2,921 个经过验证的样本、43 种问题类型和五大任务族，分别为森林砍伐监测、多灾种分析、建筑物损毁评估、洪水安全路径规划，以及基于 Sentinel-1 合成孔径雷达（SAR）的洪水监测。样本整合了异构地球观测及
    GIS 证据，包括光学与 SAR 影像、栅格掩膜、矢量几何、道路网络和暴露度图层，任务涉及灾害识别、损毁评估、暴露度估计与诊断报告生成。真实值答案由可执行地理空间工作流和确定性一致性检查提供支撑，不依赖语言模型生成标注。作者还提出一种由
    18 种灾害专用工具支撑的协同多智能体框架，角色专用智能体通过显式执行契约进行协调，并利用“角色—契约期望对齐”（Role-Contract Expectation Alignment，RCEA）完成训练。RCEA
    将故障感知的监督微调与基于契约的强化学习相结合，利用密集的步骤级信号实现对齐。实验表明，GeoDisaster 对现有遥感视觉语言模型和智能体系统提出了较高挑战，而 RCEA 能改善工具使用、证据溯源、状态一致性和决策生成。


