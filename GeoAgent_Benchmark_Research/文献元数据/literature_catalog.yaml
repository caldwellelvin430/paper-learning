  translation_scope_evidence: "# DiscoveryBench：迈向基于大语言模型的数据驱动科学发现\n\n> **翻译状态：部分翻译（摘要全译 + 明确标注的原文节译）。非全文中文精译。**\n\
    \n英文标题：DiscoveryBench: Towards Data-Driven Discovery with Large Language Models  \n发表信息：ICLR 2025  \n原始 PDF：24\
    \ 页  \n[阅读原始 PDF](./原始论文.pdf) · [英文逐页全文及配图](./英文原文_逐页全文与配图.md) · [参考文献及后续原文](./参考文献及后续原文.md) · [图表索引](./图表索引.md)\n\
    \n## 摘要（全文翻译，PDF 第 1 页）\n\n使用大语言模型（LLM）的代码生成、函数调用与数据分析能力正在迅速发展，这能否帮助我们仅依靠一组给定数据集自动搜索并验证假设？为评估这一问题，我们提出 DiscoveryBench，这是首个将数据驱动发现的多步骤过程形式化的综合基准。该基准旨在系统评估当前模型执行发现任务的能力，并提供有助于改进这些能力的资源。基准包含来自社会学和工程学等六个不同领域的\
    \ 264 项任务，通过从已发表论文中人工提取发现工作流来逼近研究人员面临的真实世界挑战；每项任务由数据集、其元数据及自然语言形式的发现目标定义。此外，我们提供 903 项合成任务，以对人工收集部分未覆盖的数据驱动工作流开展受控评价。进一步而言，我们对数据驱动发现进行的结构化形式化支持基于多个侧面的评价，从而对不同失败模式提供有用见解。我们在\
    \ DiscoveryBench 上以若干常用的 LLM 推理框架为基线，对开放和闭源 LLM 进行评价，发现即使最优秀的系统也仅取得 25% 的得分。因此，该基准揭示了自主数据驱动发现所面临的挑战，并为研究界取得进展提供有价值的资源。\n\
    \n[核对原版第 1 页](./source_pages/page-001.jpg)\n\n## 第 4.3 节：假设匹配评分（节译）（PDF 第 7 页）\n\n变量匹配使用 F1 分数 varF1，以表征真实假设和预测假设中的变量对齐程度。对于关系，GPT-4\
    \ 裁判根据与真实变量之间关系的匹配情况计算关系准确率 relacc：精确匹配关系时为 1；预测关系比真实关系更宽泛但包含真实关系时为 0.5；否则为 0。两位作者独立评价了 200 个样例上的逐步 LLM 评价流程。解决分歧后，GPT-4\
    \ 在上下文抽取、上下文匹配、变量抽取、关系准确率判断上的正确率分别为 97%、99%、94% 和 99%。最终，HMS 是对上下文匹配的假设的变量和关系维度对齐程度进行计算，并用整体上下文对齐程度加权：\n\n$$\\\
    mathrm{HMS}(h_p,h_g)=\\mathrm{ctxalign}(h_p,h_g)\\times\\mathrm"
