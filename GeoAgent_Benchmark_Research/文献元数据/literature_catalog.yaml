  translation_scope_evidence: "# GeoContra：从流畅 GIS 代码到可验证的空间分析——基于地理约束的修复\n\n**原题**：*GeoContra: From Fluent GIS\
    \ Code to Verifiable Spatial Analysis with Geography-Grounded Repair*  \n**作者**：Yinhao Xiao、Rongbo Xiao、Yihan\
    \ Zhang  \n**版本**：arXiv:2605.00782v1，2026-05-01  \n**原稿页数**：19 页\n\n> **使用说明与译文范围**：本文件为中文学术精读稿，包含原文摘要的完整中文翻译，以及对正文、方法、实验、讨论与结论的较详尽中文译述和核心表格。它**不是逐句对照的全文翻译**。为确保任何一段原文、公式、参考文献与算法都不缺失，请配合\
    \ `GeoContra_英文全文逐页提取.md` 和 `source_pages/`。下文图表截图沿用原始英文标注，文字说明以中文呈现。代码函数、字段名和公式符号不改写。\n\n## 摘要（完整翻译）\n\n可靠的空间分析是地理信息科学（GIScience）中的一项富有挑战性的任务。分析过程必须保持坐标参考语义、空间谓词、拓扑、度量单位、空间支撑（spatial\
    \ support）以及地理合理性。当前存在的差距在于：基于大型语言模型（LLM）的 GIS 系统越来越能够生成流畅的脚本与工具工作流，但很少明确表达这些地理规则，也极少在真实本地 GIS 数据上大规模验证这些规则。本文提出\
    \ **GeoContra**，一个面向 LLM 驱动的 Python GIS 工作流、以地理知识为依据的验证与修复框架。GeoContra 将每项任务表示为**可执行的地理空间契约（executable geospatial\
    \ contract）**，涵盖自然语言空间问题、数据集模式、坐标参考系（CRS）元数据、预期输出、空间关系语义、拓扑与度量约束、必须使用的 GIS 操作，以及禁止采用的捷径。生成的程序将接受静态地理规则检查、运行时成果验证和任务层语义验证；发现的违规事项被反馈给模型，进入有次数上限的修复循环。作者在覆盖大波士顿地区\
    \ 15 个区域、9 类 GIS 任务的 **7,079 个真实地理数据任务**上开展评测，并对 11 个开源模型分别进行了每模型 600 次运行。根据作者的了解，这是首个专门围绕可执行、可用契约验证的 LLM GIS\
    \ 工作流而构建的大规模基准。在完整闭源模型基准上，GeoContra 将 DeepSeek-V4 的空间正确率由 **47.6% 提升到 77.5%**，将 Kimi-K2.5 的空间正确率由 **57.7% 提升到\
    \ 81.5%**。对于 11 个开源模型，平均空间正确率提高 **26.6 个百分点**。其方法论意义在于：GeoCo"
