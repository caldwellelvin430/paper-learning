    \ Tool-Augmented LLMs  \n**作者：** Minghao Li、Yingxiu Zhao、Bowen Yu、Feifan Song、Hangyu Li、Haiyang Yu、Zhoujun Li、Fei\
    \ Huang、Yongbin Li  \n**出处：** EMNLP 2023，pp. 3102–3116  \n**文档说明：** 以下为按论文结构整理的学术中文译文。图表保持原稿样式，原文页码与截图文件对应；函数名、模型名、路径、原始引用和可执行格式保留英文。\n\
    \n## 摘要\n\n近期研究表明，大语言模型（Large Language Models，LLMs）能够借助外部工具增强自身能力。然而，仍有三个关键问题尚待回答：（1）当前 LLM 使用工具的效果如何？（2）如何提高\
    \ LLM 使用工具的能力？（3）要充分利用工具，还须克服哪些障碍？为回答这些问题，我们提出 **API-Bank**，一个专为工具增强型 LLM 设计的综合基准。针对第一个问题，我们开发了一个包含 **73 个 API\
    \ 工具**、可实际运行的评估系统，并人工标注 **314 段工具使用对话和 753 次 API 调用**，评估模型规划、检索和调用 API 的能力。针对第二个问题，我们构建包含 **1,888 段对话**的综合训练集，覆盖\
    \ **1,000 个领域**中的 **2,138 个 API**，并据此以 Alpaca 为初始模型训练工具增强型语言模型 **Lynx**。实验显示，GPT-3.5 的工具使用能力优于 GPT-3，而 GPT-4\
    \ 在规划方面表现突出，但各模型仍存在很大改进空间。此外，Lynx 的工具使用性能比 Alpaca 提高超过 26 个百分点，接近 GPT-3.5。通过错误分析，我们进一步指出该领域未来需要解决的主要挑战，以回答第三个问题。\n\
    \n## 1 引言（Introduction）\n\n近年来，大语言模型快速发展，代表包括 GPT-3（Brown 等，2020）、Codex（Chen 等，2021）、ChatGPT 和表现突出的 GPT-4（Bubeck\
    \ 等，2023）。这些模型在广泛的开放领域任务中，展现出越来越接近人类的对话、上下文学习与代码生成能力。然而，LLM 仍受训练语料约束：知识可能迅速过时，且无法覆盖全部应用情境。因此，通过让 LLM 使用外部 API\
    \ 工具获取最新信息、连接第三方服务，已成为重要研究方向。工具使用曾被视作人类特有的行为，也是灵长类进化过程中的重要里程碑。借用这一类比，我们认为，当前迫切需要回答模型能否有效使用工具、如何增强该能力，以及还存在哪些障碍这三个问题。\n\
    \n"
