  translation_scope_evidence: "# 测量真正重要的内容：大语言模型基准测试中的构念效度\n\n**英文题名**：*Measuring What Matters: Construct Validity\
    \ in Large Language Model Benchmarks*  \n**作者**：Andrew M. Bean、Ryan Othniel Kearns、Angelika Romanou 等  \n**来源**：NeurIPS\
    \ 2025 Datasets and Benchmarks Track  \n**原稿**：82 页，包括正文、参考文献与大量补充材料。\n\n> **翻译覆盖范围**：摘要、构念效度概念、研究设计、主要结果、八项建议与结论已按原文译述，并对检查清单逐项给出中文表述。**附录中很长的分类代码本、逐篇文献分类表、参考文献尚未逐句翻译**；原文已完整提取至\
    \ `英文原文_逐页完整提取.md`，原稿图与长表保存在 `images/` 和 `source_pages/`。下面的中文正文不能替代严格的全 82 页逐句译本。\n\n## 摘要（中文翻译）\n\n对大语言模型（LLM）进行评价，对于判断模型能力，以及在部署前发现安全性或鲁棒性问题都至关重要。可靠测量“安全性”“鲁棒性”等抽象而复杂的现象，要求评价具有较高的**构念效度（Construct\
    \ Validity）**，也就是评价指标确实代表了所要关注的现象。作者组织一支由 **29 位专家审查者**组成的团队，对自然语言处理和机器学习主要学术会议的 **445 项大语言模型基准**开展系统综述。研究发现，所考察论文在被测现象、任务与评分指标方面存在一些常见模式，削弱了相应评价结论的效度。为应对这些不足，作者向研究者和实践者提出\
    \ **八项关键建议**，并提供具体、可执行的基准设计指导。\n\n## 1 引言\n\n基准测试深刻影响着大语言模型的研发方向：它规定哪些改进被认为是有价值的，也帮助人们在多个模型之间做出比较。然而，建立一个基准的过程本质上是将难以直接观察的抽象现象转化为能够操作与测量的任务、数据和指标。例如，“智能”不能直接被一个数字测量，只能借助各种代理任务（proxy\
    \ tasks）间接反映。评价基准是否有价值，取决于这些代理能否充分代表现实中真正想衡量的能力。\n\n这种从目标现象到测量分数的对应关系就是构念效度。一个模型在某项测验中得到高分，并不必然意味着它具备测验名称所指的广义能力。如果任务实际要求的是记忆知识、遵循格式或利用捷径，高分就可能无法支持关于“推理能力”的宽泛结论。\n\
    \n作者指出，现有基准虽然在复现性、成本和统计分析方面得到部分改善，但围绕构念效度的系统化设计建议仍不充分。评估任务与目标现象之间的连接一旦薄弱，就可能引发不可靠的科学结论、错误的研究投入与缺乏证据支持的政策判断。\n\
    \n### 图 1：系统综述流程\n\n![](./i"
