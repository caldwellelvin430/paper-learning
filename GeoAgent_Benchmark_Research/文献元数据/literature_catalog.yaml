  translation_scope_evidence: "# LLM-as-a-Judge 能否在智能体场景中可靠验证评分细则？\n\n> **翻译状态：部分翻译（摘要全译 + 明确标注的原文节译）。非全文中文精译。**\n\
    \n英文标题：Can LLM-as-a-Judge Reliably Verify Rubrics in Agentic Scenarios?  \n发表信息：EMNLP 2026  \n原始 PDF：19 页  \n\
    [阅读原始 PDF](./原始论文.pdf) · [英文逐页全文及配图](./英文原文_逐页全文与配图.md) · [参考文献及后续原文](./参考文献及后续原文.md) · [图表索引](./图表索引.md)\n\n\
    ## 摘要（全文翻译，PDF 第 1 页）\n\n基于评分细则（rubric）的评分已成为模型评价中广泛使用的范式，通常使用 LLM-as-a-Judge（LaaJ）对评分细则打分。然而，LaaJ 在评分细则评分方面的可靠性仍缺乏充分研究。这一问题在智能体场景中尤为突出，因为较长且复杂的输出进一步增加了可靠评分的难度。为解决这一问题，我们对\
    \ LaaJ 的评分细则验证可靠性开展系统性元评价。我们提出 RuVerBench，这是首个评估智能体场景中 LaaJ 评分细则验证可靠性的基准。RuVerBench 涵盖深度研究和智能体编程两个常见智能体领域，共\
    \ 2,458 个实例，每个实例包含模型生成的输出、一条评分细则，以及指示输出是否满足该细则的人工标注标签。利用 RuVerBench，我们评价了众多前沿 LLM，发现即使最先进的模型表现强劲，仍存在相当大的噪声。我们进一步分析关键\
    \ LaaJ 策略对评分细则验证的影响，包括提示词设计、批量验证和多数投票。结果表明，较弱的模型对提示词变化更加敏感；批量验证存在准确性与效率之间的权衡；多数投票能够有效改善表现，但边际收益递减。我们已发布数据集及代码，以推动后续研究：https://github.com/THU-KEG/RuVerBench。\n\
    \n[核对原版第 1 页](./source_pages/page-001.jpg)\n\n**原文 figure 1 · PDF 第 1 页（候选图表区域）**\n\n![原文图表](./images/figure-1-p001.jpg)\n\
    \n## 第 4.1 节：任务形式化（PDF 第 4 页）\n\n我们将评分细则验证形式化为一个元评价任务，以评估充当裁判的 LLM 的可靠性。在这一设置中，裁判的输入由任务上下文 m（例如深度研究中的问答对，或智能体编程中序列化的轨迹）和需要验证的特定评分细则\
    \ rᵢ 组成。裁判需预测二元标签 ŷᵢ∈{0,1}，1 表示满足评分细则，0 表示不满足。采用二元满足度是有意为之：原子化的是/否标准在验证器管线中广泛使用，并允许可复现的真实值标注；分级评分则需要额外的量表设计以及显著更多的主观校准。"
