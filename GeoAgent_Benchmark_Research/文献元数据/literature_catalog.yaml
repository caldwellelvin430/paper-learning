  translation_scope_evidence: "# 智能体基准中的双重测量混淆：去脚手架、真实值评分与超越均值的可靠性\n\n> **翻译状态：部分翻译（摘要全译 + 明确标注的原文节译）。非全文中文精译。**\n\
    \n英文标题：The Double Measurement Confound in Agent Benchmarks: De-Scaffolding, Ground-Truth Scoring, and Reliability\
    \ Beyond the Mean  \n发表信息：arXiv:2609.09218v1（上传版本）  \n原始 PDF：31 页  \n[阅读原始 PDF](./原始论文.pdf) · [英文逐页全文及配图](./英文原文_逐页全文与配图.md)\
    \ · [参考文献及后续原文](./参考文献及后续原文.md) · [图表索引](./图表索引.md)\n\n## 摘要（全文翻译，PDF 第 1 页）\n\n智能体基准越来越多地用于比较大语言模型（LLM）并指导部署决策，但只有当基准分数测量的是模型能力而非评价管线属性时，分数才具有意义。我们识别出双重测量混淆：关键执行决策由固定脚手架而非模型作出，同时评分器依据可能无法反映任务正确性的标准评价输出。我们将这些问题统一纳入一个测量理论框架，用于刻画何时可以将基准分数解释为模型能力的证据，并通过审计与修复协议实现该框架：（i）将关键执行决策从脚手架转移到模型；（ii）用基于随机种子的真实值评分取代基于输出形态的评价；（iii）通过最差情形和尾部风险指标报告超越均值的可靠性。ComtradeBench\
    \ 上的实验表明，联合干预将几乎平坦的排行榜转化为可靠性谱系，能够区分平均表现与跨随机种子的鲁棒性。对现有基准应用审计进一步表明，评分器有效性具有基准特异性，而在我们探查的地方，脚手架决策归属始终是一个未受控制的维度。结果表明，应结合脚手架水平、评分准则与可靠性特征解释基准分数，从而为\
    \ LLM 智能体提供更有效的实用评价框架。\n\n[核对原版第 1 页](./source_pages/page-001.jpg)\n\n## 第 4.3 节：真实值指标（节译）（PDF 第 4 页）\n\n随基准发布的裁判不足以支持可靠性主张。对于本文所有主要数值，均依据由随机种子确定的规范记录集合进行评分。生成器为每条记录输出确定性\
    \ ID，因此给定任务与种子时，真实的唯一记录集合是精确已知的。令 S 为提交的记录，G 为真实值集合，U 为 S 中属于真实值且去重后的记录，则：\n\n$$R=|U|/|G|,\\quad P=|U|/|S|,\\\
    quad F1=2RP/(R+P)$$\n\n指标的范围为 [0,1]，对给定任务与种子具有确定性。与原裁判不同，当数据错误时该指标会降低：遗漏真实记录会降低召回率；重复记录、汇总行和虚构记录会增加 |S| 而不增加\
    \ |U|，从而降低精确率。\n\n[核对原版第 4 "
