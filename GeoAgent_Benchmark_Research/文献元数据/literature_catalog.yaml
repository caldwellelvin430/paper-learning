  translation_scope_evidence: "# Earth-Agent-Pro：面向真实世界全链路地球观测的智能体\n\n**原文标题**：Earth-Agent-Pro: Towards Real-World\
    \ Full-Chain Earth Observation with Agents  \n**作者**：Zhutao Lv、Chenhao Dang、Yi Feng、Yanpei Gong、Xiaolei Wang、Junyan\
    \ Ye、Conghui He、Weijia Li  \n**原文版本**：arXiv:2609.12533v1，2026 年 9 月 11 日  \n**原始 PDF**：18 页。\n\n> **翻译范围**：摘要、研究背景、评估任务定义、数据构建、工作流框架、训练方法、主要实验结果、讨论和结论已作详细中文译述；全部公式符号、关键数据表以及图\
    \ 1—8 原图保留。参考文献的书目内容仍以英文原文为准，部分密集技术段落不是严格逐句直译。完整原稿请见 `英文原文_逐页.md`、`逐页原文与配图.md` 与 `原始论文.pdf`。**不可把本文件认定为 18 页完全逐句译本。**\n\
    \n## 摘要（中文翻译）\n\n真实世界的地球观测（Earth Observation，EO）分析要求智能体能够将高层次科学问题转化为可执行的工作流，从而完成观测数据获取、数据准备、领域计算，并基于运行时证据形成结论。然而，现有地球观测智能体及基准通常只覆盖这一流程的部分环节：智能体往往从已经提供的观测数据开始工作，而基准通常提供准备好的输入或候选答案，导致开放世界环境下的全链路地球观测执行能力仍缺乏充分测试。\n\
    \n本文提出 **Earth-Agent-Pro**，一种具备执行适应能力的 Plan-and-Execute（规划—执行）框架，通过专家编写的技能来约束工作流规划和运行时工具使用。该框架在以工作流为中心的结构化记忆中记录规划步骤、已接受的证据及其依赖关系；当运行时证据使某一步失效时，仅修复受影响的工作流后缀，而不丢弃已经验证的前序工作。针对不同角色，作者通过独立的\
    \ Planner 和 Executor 适配器调整底层大语言模型：规划器使用序列级监督微调（SFT）学习工作流组合，执行器使用具有局部可验证奖励的节点级 Group Relative Policy Optimization（GRPO）学习工具参数与运行时信息的对齐。\n\
    \n为了评估开放世界全链路地球观测执行能力，作者进一步推出 **Earth-Bench-Pro**：将 248 个专家设计的核心任务置于三个相互匹配的评价情境，共构成 **744 道问题**。其中，248 道开放世界执行题覆盖\
    \ RGB 影像、光谱观测和遥感产品，给出高层次请求和运行时数据需求，要求智能体生成可执行轨迹，并依据执行证据给出开放式答案。在共享 GPT-5 骨干模型的条件下，Eart"
