    \n## 摘要（中文翻译）\n\n人工智能模型越来越多地被部署在高风险环境中，因此有必要充分评估其能力与风险。基准测试（benchmark）已成为衡量这些属性的常用方法，用于比较模型表现、跟踪技术进展，以及识别基础模型和非基础模型的弱点。基准测试还可能影响下游任务中的模型选择，并为政策行动提供依据。然而，不同基准的质量并不相同，其质量取决于设计方式和可用性。本文提出一套覆盖人工智能基准整个生命周期、包含\
    \ **46 项最佳实践**的评估框架，并依据该框架对 **24 个 AI 基准**进行评价。研究发现，不同基准之间存在较大的质量差异，部分广泛使用的基准存在显著问题。研究还发现，大多数基准未报告结果的统计显著性，也未提供便于复现结果的机制。为了帮助基准开发者落实最佳实践，作者基于该框架制定了最低质量保证检查清单，并建设持续更新的基准评估资料库，以支持基准之间的比较，网址为\
    \ `betterbench.stanford.edu`。\n\n## 1. 引言（中文译述）\n\n人工智能系统快速发展，并不断进入实际决策流程。尤其是基础模型的应用扩大，使系统可能带来的收益与风险同时增加。因此，模型能力和潜在危害的准确评估已成为重要问题。现有评估既包括开发者内部进行的专有测试，也包括基于公开基准的外部测评。基准已成为比较算法、衡量性能、追踪进步和发现薄弱环节的常规工具；模型开发者在发布系统时会报告基准分数，监管机构也会使用评估结果支持第三方审查。\n\
    \n作者沿用相关研究对“基准”的定义：它是由一个或"
