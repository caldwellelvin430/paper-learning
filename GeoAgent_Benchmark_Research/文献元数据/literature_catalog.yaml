    **原论文**：Plan-and-Solve_Prompting

    **作者**：Lei Wang、Wanyu Xu、Yihuai Lan、Zhiqiang Hu、Yunshi Lan、Roy Ka-Wei Lee、Ee-Peng Lim

    **PDF 页数**：26


    > 阅读说明：本文件提供按照原文结构整理的中文学术译述（涵盖研究背景、方法、评价、结果、附录说明），不是逐词、逐句覆盖全部英文的严格全文翻译。原 PDF 全部页面的英语文字、图表和参考文献保留于 `英文原文_逐页.md`、`original.pdf`
    和 `source_pages/`。代码、模型名称、API 和学术引用保留原样，详情见 `QA_逐页核查.md`。


    ## 论文摘要（中文译文）


    近年来，大语言模型（LLM）在多种自然语言处理任务中取得显著成绩。为了完成多步骤推理任务，少样本思维链（Few-shot CoT）提示通常依赖人工编写的逐步推理示例；零样本思维链（Zero-shot-CoT）通过在问题后追加“Let’s
    think step by step”（让我们一步一步思考）免除了人工示例，但仍存在计算错误、缺失推理步骤和语义误解三类问题。为了缓解推理步骤缺失，本文提出“规划并求解”（Plan-and-Solve，PS）提示：先为问题设计将其分解为子任务的计划，再依照计划逐项求解。为了进一步减少计算错误并提高推理步骤质量，作者加入更详细的指令，提出
    PS+ 提示。研究在十个数据集、三类推理任务上测试了这两种方法。使用 GPT-3 的结果表明，所提出的零样本提示方法在全部数据集上显著优于 Zero-shot-CoT，与零样本程序化思维（PoT）提示相比具有可比或更好表现，并在数学推理任务中达到接近八示例
    CoT 的成绩。论文代码见 https://github.com/AGI-Edgerunners/Plan-and-Solve-Prompting 。


