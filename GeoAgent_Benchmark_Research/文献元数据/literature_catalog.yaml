  translation_scope_evidence: "# Agent-as-a-Judge：使用智能体评价智能体\n\n> **翻译状态：部分翻译（摘要全译 + 明确标注的原文节译）。非全文中文精译。**\n\n英文标题：Agent-as-a-Judge:\
    \ Evaluate Agents with Agents  \n发表信息：ICML 2025  \n原始 PDF：43 页  \n[阅读原始 PDF](./原始论文.pdf) · [英文逐页全文及配图](./英文原文_逐页全文与配图.md)\
    \ · [参考文献及后续原文](./参考文献及后续原文.md) · [图表索引](./图表索引.md)\n\n## 摘要（全文翻译，PDF 第 1 页）\n\n现有评价技术不足以评价智能体系统。这些方法要么仅关注最终结果——忽略智能体系统逐步展开的思考过程——要么需要大量人工劳动。为解决这一问题，我们引入\
    \ Agent-as-a-Judge 框架，即使用智能体系统评价智能体系统。这是 LLM-as-a-Judge 框架的自然扩展，其中融入了智能体特性，能够对整个任务求解过程提供中间反馈，从而实现更精确的评价。我们将\
    \ Agent-as-a-Judge 应用于代码生成任务。为了克服现有基准的不足，并为 Agent-as-a-Judge 提供概念验证测试平台，我们提出 DevAI，这是由 55 项真实的 AI 代码生成任务组成的新基准。DevAI\
    \ 包含丰富的人工标注，例如总计 365 项层次化的解决方案要求，因而特别适合智能体裁判。我们使用 Agent-as-a-Judge 对三个领先的代码生成智能体系统进行基准测试，发现该框架显著优于 LLM-as-a-Judge，并且与人工评价基线一样可靠。总体而言，我们认为这项工作是实现更加复杂的智能体系统的一项具体进展。为推动这方面的发展，我们的数据集和\
    \ Agent-as-a-Judge 的完整实现将公开于 https://github.com/metauto-ai/agent-as-a-judge。\n\n[核对原版第 1 页](./source_pages/page-001.jpg)\n\
    \n## 引言（节译）（PDF 第 1 页）\n\n近年来，多模态智能体系统已从偶尔能够解决小型玩具问题，发展到经常被部署以处理富有挑战性的真实世界问题。然而，智能体系统现有的评价方法与可用基准难以跟上这种快速进展，显著阻碍了真正的进步。我们认为，当前智能体评价的问题源于缺乏对这些非传统系统任务求解中间阶段的反馈。智能体系统更像人一样思考，逐步行动，并且往往在内部进行类似人类的自然语言讨论来解决问题。因此，对它们的评价也应像评价人一样，提供考察完整思考与行动轨迹的丰富反馈。使用传统方法评价智能体系统，好比使用选择题评价学生，是一种相对不可靠的估计方法。\n\
    \n[核对原版第 1 页](./source_pages/page-001.jpg)\n\n#"
