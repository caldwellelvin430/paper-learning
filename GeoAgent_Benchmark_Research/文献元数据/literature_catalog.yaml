  translation_scope_evidence: "# AgentProcessBench：诊断工具使用智能体的步骤级过程质量\n\n> **翻译状态：部分翻译（摘要全译 + 明确标注的原文节译）。非全文中文精译。**\n\
    \n英文标题：AgentProcessBench: Diagnosing Step-Level Process Quality in Tool-Using Agents  \n发表信息：KDD 2026  \n原始\
    \ PDF：12 页  \n[阅读原始 PDF](./原始论文.pdf) · [英文逐页全文及配图](./英文原文_逐页全文与配图.md) · [参考文献及后续原文](./参考文献及后续原文.md) · [图表索引](./图表索引.md)\n\
    \n## 摘要（全文翻译，PDF 第 1 页）\n\n尽管大语言模型（LLM）已经发展为能够使用工具的智能体，但它们在长时程交互中仍然较为脆弱。与数学推理中通常能够通过回溯纠正的错误不同，工具使用中的失败经常产生不可逆的副作用，因此准确的步骤级验证至关重要。然而，现有过程级基准主要局限于封闭世界的数学领域，未能反映工具执行的动态性和开放性。为弥补这一差距，我们提出\
    \ AgentProcessBench，这是首个专门用于评价真实工具增强轨迹中步骤级有效性的基准。该基准包含 1,000 条多样化轨迹和 8,509 项人工步骤标注，标注者间一致率为 89.1%。它采用三元标注方案来刻画探索行为，并使用错误传播规则减少标注歧义。大量实验揭示了以下重要发现：（1）较弱的策略模型因过早终止而呈现虚高的正确步骤比例；（2）区分中性行为和错误行为仍然是当前模型面临的重大挑战；（3）源自过程的信号能够为结果监督提供互补价值，显著提升测试时扩展的效果。我们希望\
    \ AgentProcessBench 能推动奖励模型的未来研究，并为通用智能体的发展铺平道路。\n\n[核对原版第 1 页](./source_pages/page-001.jpg)\n\n## 第 3.1 节：评价协议与三元标签（节译）（PDF\
    \ 第 4 页）\n\n给定任务描述 T 以及工具使用智能体生成的交互轨迹 X=(m₀,…,mₙ₋₁)，其中消息具有 system、user、assistant 和 tool 等不同角色，令 I 为所有 assistant\
    \ 消息的索引集合。任务是输出标签序列 Y={yᵢ | i∈I}，其中 yᵢ∈{−1,0,+1} 分别表明对应步骤对总体任务推进是有害、中性或有效的。\n\n- +1（正确且有效）：步骤在事实上正确，并明确推进任务完成。例如正确调用工具或解释工具输出，引入能够实质性减少任务不确定性的有效约束、决策或信息，或者识别前一步错误并采取适当纠正行动。\n\
    - 0（中性或探索）：步骤合理，但对任务推进影响有限或可忽略，包括遇到不可避免的外部故障（例如有效 URL 返回 404）、没有新见解的重复表述或局部计划"
