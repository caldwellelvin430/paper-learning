  translation_scope_evidence: "# 超越最终答案：评估工具增强型智能体的推理轨迹\n\n**英文题名**：Beyond the Final Answer: Evaluating the Reasoning\
    \ Trajectories of Tool-Augmented Agents  \n**作者**：Wonjoong Kim、Sangwu Park、Yeonjun In、Sein Kim、Dongha Lee、Chanyoung\
    \ Park  \n**机构**：韩国科学技术院（KAIST）；延世大学（Yonsei University）  \n**出版信息**：ICML 2026，PMLR 306，原 PDF 共 30 页。  \n**核心方法**：TRACE（Trajectory-based\
    \ Reasoning Assessment and Comprehensive Evaluation，基于轨迹的推理评估与综合评价）  \n**源论文**：[官方 PMLR 页面](https://proceedings.mlr.press/v306/kim26bg.html)；[arXiv\
    \ PDF（30 页）](https://arxiv.org/pdf/2510.02837)。\n\n> **资料完整性说明**：本文件翻译了论文的主要学术叙述、方法定义、指标与实验发现，并整理附录内容；保留数据表及公式数值。由于当前上传文件的原始\
    \ PDF 字节未能被图表处理环境读取，未能把原始图表截图写入本压缩包。图表索引逐一提供原 PDF 页码链接，不能将该替代方式视为完成了“原图本地截取”，也不能将本稿称为逐句全文译本。正式引用前请对照原 PDF。\n\
    \n## 摘要\n\n尽管近期工具增强型智能体基准包含越来越复杂的请求，但评价仍主要局限于最终答案匹配，忽略了效率、幻觉和适应性等关键的轨迹属性。最直接的轨迹评估方法是将智能体轨迹与标准轨迹比较，但为同一问题标注所有可能正确的标准轨迹成本极高。针对这一问题，作者提出\
    \ **TRACE**，一种不依赖预先定义的单一路径参考答案的多维工具增强型大语言模型评价框架。TRACE 使用一个持续收集先前步骤知识的**证据库（evidence bank）**，对智能体的推理轨迹进行评估。为检验这一框架，研究构建新的元评价（meta-evaluation）数据集，包含多样且存在刻意缺陷的轨迹，并为其提供多维评价标签。实验表明，即使使用较小的开源大语言模型，TRACE\
    \ 也能有效评价复杂轨迹。进一步将 TRACE 应用于真实工具增强智能体的轨迹后，作者发现了过去仅依据最终准确率而被掩盖的能力差异，并讨论了其对智能体改进的启示。\n\n## 1 引言\n\n随着大语言模型（LLM）的持续进步，能够借助外部工具突破自身能力限制的工具增强型智能体获得广泛关注。相应的基准测试也不断出现，用于衡量智能体解决任务的能力。然而，已有评"
