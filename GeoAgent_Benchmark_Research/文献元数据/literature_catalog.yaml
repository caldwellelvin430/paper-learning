    \ **EO-Gym**，一个面向多模态、工具使用型地球观测智能体的受控可执行框架。EO-Gym 将地球观测分析建模为 Gymnasium 风格的本地地理空间工作区，底层包含按位置、时间和传感器类型索引的 **66\
    \ 万余个多模态文件**，并提供覆盖六类任务的 **35 种专业 EO 工具**。\n\n基于该环境，作者构建了 **EO-GYM-DATA**：包含 **9,078 条轨迹与 34,604 个推理步骤**，使用八个公开\
    \ EO 数据集及 Landsat、Sentinel-2 影像。对 10 个开源和闭源视觉语言模型（VLM）的测试发现，即使能力较强的通用模型，在时间维度与跨模态交互工作流中仍面临显著困难。作者进一步在 Qwen3-VL-4B-Instruct\
    \ 上微调得到 **EO-GYM-4B**；在主评价设置下，整体 **Pass@3 从 0.49 提升至 0.74**。EO-Gym 通过可复现的可执行环境，将 EO 分析明确表述为需要跨空间、时间和传感器模态规划的证据获取问题。\n\
    \n## 1. 引言：从静态遥感图像问答走向交互证据获取\n\n常见 EO 问题难以仅凭一张初始图像解决。对目标是否发生变化的判断可能需要调取历史影像；由于云层遮挡而无法使用光学数据时，可能必须转向 SAR；当图像范围过小时，可能需要平移、缩放、获取邻接瓦片并重新观察。传统评测更强调对固定输入作出回答，而缺少对模型主动搜集证据的状态序列进行评价的统一环境。\n\
