  translation_scope_evidence: "# AI 基准测试中的问题题目：发现与修订\n\n**英文原题：** Fantastic Bugs and Where to Find Them in AI Benchmarks\
    \  \n**作者：** Sang T. Truong、Yuheng Tu、Michael Hardy 等，Stanford University。  \n**原稿：** 31 页。专业术语与数学符号尽量依据原稿保留。\n\
    \n> **覆盖说明：** 以下包含摘要全文翻译、主文方法和实证结果的详细中文译述、关键公式及图表中文说明。附录中的题目样例、长证明与 NeurIPS 检查清单没有全部逐句翻译；它们及完整参考文献均保留在逐页英文稿和原始\
    \ PDF 中。\n\n## 摘要（全文翻译）\n\n基准测试在推动人工智能进步方面发挥着关键作用，而无效的基准题目常常损害其可靠性。对数千道基准题目逐一进行人工排错和修正既不切实际，也已成为实现可信评估的一项重要瓶颈。本文提出一种**系统性基准修订框架**：通过分析模型回答的统计模式，标记可能存在缺陷的题目，再交由领域专家审查。该方法基于\
    \ AI 评估中常用的一个核心假设，即平均得分足以概括模型的整体表现。这个假设意味着测量实验由一个**单维潜在构念（unidimensional latent construct）**驱动，并由此对每道题的多种统计量规定了预期范围。当一题的经验统计值超出这些范围时，其存在问题的可能性就更高。本文在九个广泛使用的基准上进行验证，所提出的方法能够指导专家审查，并以最高\
    \ **84% 的精确率**识别存在问题的题目。此外，作者引入 LLM 裁判进行第一轮审查，进一步减少专家劳动。两部分结合形成了一种高效且可扩展的系统性基准修订框架。\n\n## 1 引言\n\nGSM8K、MMLU\
    \ 等基准通过其评分与排行榜影响模型开发和资源投入；但这种比较只有在题目本身有效时才具有解释意义。错误的答案键、含糊的题目描述和不恰当的自动评分，都可能改变模型排序。原文援引先前对 GSM8K 的调查：约 5% 题目存在问题；修订前后，部分模型的相对排名发生了明显变化。\n\
    \n规模化审计的困难在于：大型基准有成千上万道题，覆盖医学、数学、语言和不同文化环境；判断正确答案往往需要专家参与，检查**评分错误（grading issues）**更需要比对模型输出，而不仅仅核对题目和答案。作者因此提出：先从多个\
    \ LLM 的作答矩阵中提取与测量理论相关的异常信号，再把最值得检查的问题交给人类专家，最后对发现的问题进行修改。\n\n论文贡献包括：将心理测量方法移植到 AI 基准题目修订任务；在九个基准验证其筛查价值；利用 LLM\
    \ 充当初步审查者，把专家注意力集中到不确定和高风险样本上。这里的统计方法输出的是**候选异常题目**，并不自动证明一道题无效。\n\n## 2 相关工作\n\n过去已有研究指出，标签错"
