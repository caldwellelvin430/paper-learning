    ## 摘要（完整中文翻译）


    天气科学基础模型以海量结构化数值数据为预训练材料，其预测性能已经超过部分传统天气预报系统。但这类模型缺乏基于自然语言的推理能力，限制了它们在交互式科学工作流中的使用。大语言模型（LLM）擅长理解和生成文本，却不能直接充分处理高维气象数据。本文通过构建面向天气科学的智能体框架来弥合两者之间的差距。框架包含一个用于智能体操作天气数据的
    Python 代码环境 ZephyrusWorld，提供 WeatherBench 2 数据集索引、将自然语言地名转换为空间位置的地理编码工具、天气预报、气候模拟，以及支持查询不同时间尺度气候统计量（例如均值、极值、分位数）的气候态模块。作者设计了多轮
    LLM 天气智能体 Zephyrus，使其能够反复分析天气数据、观察运行结果并根据对话式反馈改进分析方案。此外，论文提出新基准 ZephyrusBench，利用可扩展的数据生成管线构建各种天气相关问答，任务从基础数据检索扩展至预报、极端事件检测和反事实推理。实验发现，Zephyrus
    智能体在该基准上的正确率比纯文本基线最多高 44 个百分点。不过，即使使用前沿大语言模型，困难任务依然具有挑战，显示出继续改进的空间。作者公开了框架与基准代码。


    ## 主要研究章节（中文学术译述）



    ### 问题背景


    天气与气候分析依赖高维、多变量、连续时空网格数据，通常需要结合再分析资料、数值预报模型、统计方法和业务经验。语言模型虽然能解释文字问题，却无法仅凭内部知识可靠计算真实的温度、风场或极端天气指标。Zephyrus 希望借助可执行工具和数据环境，把语言理解与气象计算连接起来。


    ### ZephyrusWorld 环境


    ZephyrusWorld 提供统一的 Python 工具环境，涵盖 WeatherBench 2 数据集索引、自然语言地名到坐标的转换、天气预报器、基于 JCM 的气候模拟，以及按时间尺度查询均值、极值和分位数等气候态统计信息。程序执行服务负责调用上述工具，再把数值结果反馈给智能体。


