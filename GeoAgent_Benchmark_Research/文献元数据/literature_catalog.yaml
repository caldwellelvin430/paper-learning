  translation_scope_evidence: "# ThinkGeo：面向遥感任务的工具增强智能体评估\n\n> 原题：*ThinkGeo: Evaluating Tool-Augmented Agents for\
    \ Remote Sensing Tasks*  \n> 作者：Akashah Shabbir、Muhammad Akhtar Munir、Akshay Dudhane、Muhammad Umer Sheikh、Muhammad\
    \ Haris Khan、Paolo Fraccaro、Juan Bernabe Moreno、Fahad Shahbaz Khan、Salman Khan。  \n> 原稿：arXiv:2505.23752v3，标注日期\
    \ 2026-04-02，共 14 页（其中补充材料 4 页）。  \n> **翻译范围说明**：下文完整覆盖研究问题、方法、数据、指标、结果、结论和补充材料的关键说明；为保证工具调用示例可复现，原始 JSON、命令、参考文献条目及部分图内英文保留在原稿/英文提取文件中。个别段落为忠实合并译述，不能等同于全部英文逐句对译。\n\
    \n## 摘要（中文翻译）\n\n近年来，大语言模型（Large Language Models，LLMs）的进步使工具增强智能体能够通过逐步推理解决复杂的现实任务。然而，现有评估主要围绕通用任务或多模态场景，缺少能够评测复杂遥感应用中工具使用能力的领域专用基准。本文提出\
    \ **ThinkGeo**，这是一个面向遥感任务、通过结构化工具使用和多步骤规划评估大语言模型驱动智能体的基准。该基准受到工具交互范式启发，收录了经人工整理的真实应用查询，覆盖城市规划、灾害评估与变化分析、环境监测、交通分析、航空监测、休闲基础设施和工业场地分析等场景。任务以卫星或航空影像为依据，既涉及光学\
    \ RGB 数据，也包含合成孔径雷达（SAR）影像，并要求智能体在多种工具之间进行推理与协调。研究实现了 ReAct 风格的交互循环，在 **486 项结构化智能体任务、1,778 个专家核验的推理步骤**上评估开源和闭源模型，包括\
    \ GPT-4o、Qwen2.5 等。该基准同时报告逐步执行指标与最终答案正确性。分析揭示了不同模型在工具准确性和规划一致性方面的显著差异。ThinkGeo 为研究具备工具使用能力的大语言模型智能体如何在遥感情境下完成空间推理，提供了一个系统性试验平台。\n\
    \n## 1. 引言\n\n近期 LLM 的发展催生了工具增强智能体：它们可以把复杂任务分解为逐步执行的计划，调用视觉模型、计算器、代码解释器等外部工具，并根据中间状态继续推理。ReAct 式框架让模型在“思考—行动—观察”间交替，推动了这一范式的发展。ToolBench、GAIA、GTA\
    \ 等基准已经能测量通用任务中的过程正确性、工具使用和最终结果，但它们大多基于合成、开放域或网络信息，无法充分覆盖对空间精度要求很高的"
