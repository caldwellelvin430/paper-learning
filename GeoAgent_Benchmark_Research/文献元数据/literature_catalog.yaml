  translation_scope_evidence: "# SCIRIGOR：超越最终分数的开放式科学分析评价\n\n> **翻译状态：部分翻译（摘要全译 + 明确标注的原文节译）。非全文中文精译。**\n\n英文标题：SCIRIGOR:\
    \ Evaluating Open-Ended Scientific Analysis Beyond Final Scores  \n发表信息：arXiv:2609.06192v1（上传版本）  \n原始 PDF：21\
    \ 页  \n[阅读原始 PDF](./原始论文.pdf) · [英文逐页全文及配图](./英文原文_逐页全文与配图.md) · [参考文献及后续原文](./参考文献及后续原文.md) · [图表索引](./图表索引.md)\n\
    \n## 摘要（全文翻译，PDF 第 1 页）\n\n科学编程智能体越来越多地执行长时程、开放式工作流，产生相互依赖的代码、数值结果、图像及科学主张。现有评价通常孤立地对工作流完成情况或最终工件进行评分。这些分数无法证明所报告的主张是否获得同一次运行所产生的数据、计算和可视化的支持。我们将具有多模态工件、基于证据的科学分析形式化为一项评价任务。给定科学问题、可直接用于分析的数据和研究上下文，智能体必须产出可执行分析、结构化结果、可视化和原子化科学主张。成功要求报告所有必需的发现，并使每项主要主张保有经过验证的同次运行支持路径。SCIRIGOR\
    \ 将细粒度评价框架与面向该任务的证据完备基准相结合。该框架将生成工件重构为具有类型的证据图，分别评价工件保真度和边的有效性，通过完整的计算与可视化路径对主张评分，并定位最早缺乏支持的关系。源证据约束下的替代路径允许科学上等价的方法和可视化编码，而最弱环节评分揭示貌似可信的下游输出背后的上游错误。基准包含来自\
    \ Nature 等期刊科学论文的 100 个案例，覆盖六个领域与 17 个子领域。每个案例对齐问题、完整输入、可执行的源分析、数值结果、源图像、原子化发现与来源追溯信息。我们在 SCIRIGOR 上评价了 11 种智能体/模型配置。在全基准运行中，无论结果是否忠实于科学目标，智能体主张与其自身结果的一致率都几乎相同（91.8%\
    \ 与 91.0%）。然而，没有系统的软证据链评分超过 62.6%，严格全链成功率也没有超过 18.0%。因此，内部一致性不足以成为科学正确性的证据：必须沿完整的数据到主张路径验证其支持关系。\n\n[核对原版第 1\
    \ 页](./source_pages/page-001.jpg)\n\n## 引言：错误链示例（节译）（PDF 第 1 页）\n\n考虑一个询问极端高温下外卖配送工作量如何变化的案例（附录 F.2）。源回归将估计值与置信区间限值存储在对数尺度上，因此正确分析必须对三个数值均进行\
    \ 100[exp(x)−1] 转换。若智能体只转换估计值，它仍可能给出看似正确的发现：增加 18.0%（95% CI 12.6–23."
