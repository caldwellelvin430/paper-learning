  translation_scope_evidence: '# MSEarth：面向地球科学现象发现的多模态基准


    > **翻译范围说明**：摘要为完整中文翻译；其余正文属于重点章节译述，附录中的长提示词、详细示例和参考文献未逐条翻译。


    ## 原文摘要｜完整中文翻译


    多模态大语言模型（Multimodal Large Language Models，MLLMs）的快速发展，为解决复杂科学问题带来了新的机遇。然而，由于缺乏能够反映地学推理深度与复杂性的评测基准，这类模型在地球科学领域——尤其是研究生层次的问题——仍未得到充分探索。现有数据集通常依赖合成数据或简单的图文配对，难以体现真实应用需要的细致推理。为解决这一问题，作者提出
    MSEarth：一个从高质量开放获取学术文献中构建的多模态科学数据集及评测基准。它覆盖大气圈、冰冻圈、水圈、岩石圈和生物圈五大地球科学圈层，包含超过 28.9 万幅科学图像，并为这些图像编制经过改进的图注，使其包含原论文中的上下文讨论与推理信息。该基准支持科学图像描述、多项选择题以及开放式推理等任务，为开发和评价具有科学推理能力的多模态模型提供可扩展且高保真的资源。MSEarth
    已公开发布，以支持后续研究。


    ## 科学图像为何不能只依赖原始图注｜节译


    科学论文中的图表通常只在图注中给出数据对象和最基本的解释，而真正支撑科学结论的假设、证据、推理以及局限常分散在正文中。直接利用原始图注生成问答，可能只考察模型能否复述图表表面内容，并不能评价对科学现象的深入理解。


    ## 数据集构建｜重点译述


    作者从多学科地球科学开放获取文献中提取大量科学图片，并将图题与正文中相关的解释内容结合，形成**改进图注（refined captions）**。改进图注不再只是图片说明，而是融入现象成因、变量关系、研究假设和结论语境。论文报告提取了
    **289,891 张图像**，用于进一步构建科学图像描述、多项选择题和开放式问答等任务。基准覆盖的五大圈层分别是大气圈、冰冻圈、水圈、岩石圈和生物圈。


    ## 任务与评价｜重点译述


    MSEarth 从**图像描述生成、客观选择题、开放式解释**三个方向测试多模态科学能力。论文比较原始图注与改进图注的作用，强调在生成问题时必须尽量保留原论文推理上下文，避免出现不依赖图像即可猜中的任务，或虽然形式复杂但证据不足的问题。


    对于你研究的 Benchmark 可靠性审计，MSEarth 可以用作**科学答案的证据依赖性与任务有效性**案例。不过它主要评价多模态科学理解，并非以实时 GIS 工具执行状态作为核心 GT。


    ## 图表阅读提示


    - **图 1**：只使用原始图注与使用改进图注生成 VQA 的对照。

    - **表 1**：MSEarth 与其他多模态科学 Benchmark 的规模和任务形式比较。

    - **图 2–3**：数据构建流程与多智能体生成、验证框架'
