  translation_scope_evidence: "# Earth-Agent：借助智能体释放地球观测的全部潜力\n\n**原题：** Earth-Agent: Unlocking the Full Landscape\
    \ of Earth Observation with Agents  \n**作者：** Peilin Feng、Zhutao Lv、Junyan Ye、Xiaolei Wang、Xinjie Huo、Jinhua\
    \ Yu、Wanghan Xu、Wenlong Zhang、Lei Bai、Conghui He、Weijia Li  \n**收录：** ICLR 2026，原稿 65 页。  \n**代码：** https://github.com/opendatalab/Earth-Agent\
    \  \n**数据集：** https://huggingface.co/datasets/Sssunset/Earth-Bench  \n**项目页面：** https://opendatalab.github.io/Earth-Agent/\n\
    \n> 说明：本中文稿按原文章节结构译写摘要、导言、相关工作、核心方法、评价指标、主要实验和结论，并整理附录 A–G 的技术说明与全部图表索引。大量工具 API 表格、长代码块及案例图中的英文原始内容保留为截图和逐页英文稿，尚不能视为每个英文句子均已逐句汉化的严格全译本。原始\
    \ PDF、65 页逐页提取稿以及原稿截图全部附于压缩包。\n\n## 摘要\n\n地球观测（Earth Observation，EO）对于理解地球系统不断变化的状态至关重要。尽管近年来多模态大语言模型（Multimodal\
    \ Large Language Models，MLLMs）推动了 EO 研究的发展，但它们仍缺少解决复杂任务所需的多步推理与领域专用工具使用能力。基于智能体（Agent）的方法提供了有前景的方向，但现有工作仍处于早期阶段，通常局限于\
    \ RGB 图像感知、浅层推理，且缺少系统性的评价协议。\n\n为克服这些限制，本文提出 **Earth-Agent**：一个基于模型上下文协议（Model Context Protocol，MCP）的工具生态，统一支持\
    \ RGB 与光谱类 EO 数据，使系统能够超越预训练 MLLM 的既有能力，完成跨模态、多步骤、定量的时空推理。Earth-Agent 可以动态调用专家工具和模型，完成地球物理参数反演、定量时空分析等复杂科学任务。\n\
    \n为实现综合评价，作者进一步构建 **Earth-Bench**，包含 **248 道专家编写的任务、13,729 幅图像**，覆盖光谱、地球观测产品和 RGB 三种数据模态，并引入同时评估推理轨迹与最终结果的双层评价协议。论文通过改变\
    \ LLM 主干模型、与通用智能体框架比较、与遥感 MLLM 在遥感任务上比较等实验，验证了 Earth-Agent 的有效"
