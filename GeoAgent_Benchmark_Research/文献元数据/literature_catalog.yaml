  translation_scope_evidence: "# τ-bench：面向真实世界领域中工具—智能体—用户交互的基准\n\n**英文标题**：*τ-bench: A Benchmark for Tool-Agent-User\
    \ Interaction in Real-World Domains*  \n**作者**：Shunyu Yao、Noah Shinn、Pedram Razavi、Karthik Narasimhan  \n**版本**：arXiv:2406.12045v1，2024-06-17；Sierra\
    \ 预印本  \n**原稿页数**：50 页。\n\n> **阅读及译文范围**：本文档提供原论文摘要的完整中文翻译，以及主要正文、核心公式、实验结果、研究局限与附录结构的中文学术译述。它**不等同于逐句完整翻译 50\
    \ 页**。原稿中的英文领域政策、函数定义、JSON 示例及 50 页英文全文已逐页保存在 `tau-bench_英文全文逐页提取.md`，每一页的截图位于 `source_pages/`。特别是大型附录中的政策条款及工具代码，不能只凭下面的中文译述替代原文复现。\n\
    \n## 摘要（完整翻译）\n\n现有基准测试未能检验语言智能体与人类用户进行交互的能力，也没有检验其遵守特定领域规则的能力，而这两种能力对于智能体在真实世界应用中部署都至关重要。我们提出 **τ-bench**，一个通过模拟用户（由语言模型扮演）与拥有领域专用\
    \ API 工具和政策指南的语言智能体之间的动态对话来开展测试的基准。我们采用一种高效且忠实的评测方式：比较对话结束时的数据库状态和人工标注的目标状态。我们还提出新的指标 **pass^k**，用于评估智能体在多次试验中行为的可靠性。实验结果表明，即使是最先进的函数调用智能体（如\
    \ gpt-4o），在不足 50% 的任务上取得成功，并且其表现非常不稳定（在零售领域的 `pass^8 < 25%`）。这些发现凸显了开发新方法的必要性，以提升智能体采取一致行动并可靠遵守规则的能力。\n\n##\
    \ 1 引言\n\n作者指出，在真实业务中，智能体不是收到完整指令后就能一次性执行的自动化脚本。它必须在较长的交互周期里同时与用户及程序化 API 通信，以逐步补齐信息；理解复杂且领域特定的政策；并在大量会话中保持稳定一致的行为。\n\
    \n以机票改签为例，用户要求换目的地机场时，智能体需要查询现有订单、确认票种限制、寻找备选航班、必要时征求取消再预订的授权，且不能违反航空公司的改签与退票规则。相同请求可能在不同的对话方式下表达，可靠的智能体应该得到相同的正确最终结果。\n\
    \n传统基准通常把所有信息提前提供给智能体，再考察其与网页、终端或 API 的交互；τ-bench 则把真实场景中关键的**用户交互、部分信息、政策约束、数据库更新及多次试验的一致性**纳入同一个评测框架。作者首先设计了零售客服\
    \ `τ-retail` 与航空客服 "
