  translation_scope_evidence: "# ClimateAgent：面向复杂气候数据科学工作流的多智能体编排\n\n**原文：** ClimateAgent: Multi-Agent Orchestration\
    \ for Complex Climate Data Science Workflows  \n**作者：** Chenyue Li、Hyeonjae Kim、Wen Deng、Mengxi Jin、Wen Huang、Mengqian\
    \ Lu、Binhang Yuan  \n**期刊：** Transactions on Machine Learning Research（2026 年 4 月）  \n**本文 PDF：** 53 页，正文后包含大量附录、Agent\
    \ 提示词、运行案例与消融结果。\n\n> **译稿范围说明：** 这是依据原文撰写的中文核心章节学术翻译与详细译述，非 53 页的逐句完整译文。全部英文正文、算法、代码/提示词、参考文献和附录，均保留在 `英文原文_逐页.md`\
    \ 与 `逐页原文与图表对照.md`，并提供逐页原版截图。附录中的代码与配置文件应以原文为准。\n\n## 摘要（完整翻译）\n\n气候科学需要自动化工作流，将综合性研究问题转化为基于数据的科学论述，而这些工作流必须处理规模巨大、来源和格式各异的数据集。然而，通用大语言模型智能体与静态脚本流水线缺乏气候领域专门知识及灵活性，在实践中的表现并不理想。本文提出\
    \ **ClimateAgent**，一个能够编排端到端气候数据分析工作流的自主多智能体框架。ClimateAgent 使用 Orchestrate-Agent 和 Plan-Agent 协调任务，将用户问题分解为可执行子任务；通过专门的\
    \ Data-Agent 动态检查数据接口（API），生成稳健的下载脚本；再由 Coding-Agent 生成 Python 分析代码、可视化与最终报告，并通过内置自纠错循环处理执行失败。\n\n为系统评估该框架，作者提出\
    \ **Climate-Agent-Bench-85**，由 **85 道真实气候工作流任务**构成，覆盖大气河流、干旱、极端降水、热浪、海表温度和热带气旋六个主题。在该基准上，ClimateAgent 的任务完成率达到\
    \ **100%**，报告质量得分 **8.32**，优于 GitHub Copilot（**6.27**）和 GPT-5 基线（**3.26**）。结果表明，结合动态 API 感知能力与自纠错执行的多智能体编排可明显提升气候科学端到端自动化的可靠性。代码地址为\
    \ `https://github.com/Relaxed-System-Lab/ClimateAgent`。\n\n## 1. 引言：气候科学自动化面临的困难\n\n气候研究经常需要将自然语言问题转化为长流程：发现合适的数据源，在\
    \ CDS / ECMWF 等服务中确定变量与时"
