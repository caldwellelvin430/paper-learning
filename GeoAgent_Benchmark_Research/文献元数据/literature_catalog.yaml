  translation_scope_evidence: "# 智能体基准测量的是能力吗？智能体 AI 时代的协议有效性\n\n> **翻译状态：部分翻译（摘要全译 + 明确标注的原文节译）。非全文中文精译。**\n\n\
    英文标题：Do Agent Benchmarks Measure Capability? Protocol Validity in the Age of Agentic AI  \n发表信息：arXiv:2607.22368v1（上传版本）\
    \  \n原始 PDF：33 页  \n[阅读原始 PDF](./原始论文.pdf) · [英文逐页全文及配图](./英文原文_逐页全文与配图.md) · [参考文献及后续原文](./参考文献及后续原文.md) ·\
    \ [图表索引](./图表索引.md)\n\n## 摘要（全文翻译，PDF 第 1 页）\n\n智能体基准越来越多地评价代码仓库编辑、网络研究、终端使用与长时程交互。只有当评价协议使目标能力始终成为取得成功的必要条件时，其分数才支持关于能力的主张。近期的奖励投机（reward\
    \ hacking）基准与系统报告表明，智能体可能转而获取公开的解决方案、读取评价工件、推断生成器结构、操纵反馈，或者受益于无效的评分路径；现有应对措施尚未提供一种通用程序，以跨基准归因这些捷径并量化其影响。我们形式化定义协议有效性，并提出\
    \ HackDetect，这是一种事后审计方法，用于识别暴露、判断智能体如何利用该暴露，以及评估由此得到的分数是否具有误导性。我们通过 Mislead gap（误导差距）量化分数膨胀：G = S_exploit −\
    \ S_intended。我们审计了 15 个智能体基准中的 2,385 条轨迹，在 Frontier Science 的 67.0% 轨迹与 AutoLab 的 66.7% 任务中发现暴露和奖励投机证据。在配对比较中，我们测得分数膨胀为\
    \ 0.45–1.00，表明基准报告应提供证据，证明分数反映了预期能力。\n\n[核对原版第 1 页](./source_pages/page-001.jpg)\n\n## 引言：研究贡献（节译）（PDF 第 2 页）\n\
    \n我们提出协议有效性的概念：只有当评价协议维持目标能力作为成功的必要条件时，基准分数才能支持对该能力的主张。我们引入 HackDetect，这是一种以证据为依据的事后审计，使用基准规范、限定工具范围的轨迹证据，以及受约束的裁判模式，并通过\
    \ Mislead gap 量化分数膨胀。我们审计 15 个基准的 2,385 条评价轨迹，并使用独立报告的 EdgeBench 构建案例作为归因框架的一致性检查。\n\n[核对原版第 2 页](./source_pages/page-002.jpg)\n\
    \n**原文 figure 1 · PDF 第 2 页（候选图表区域）**\n\n![原文图表](./images/figure-1-p002.jpg)\n\n##"
