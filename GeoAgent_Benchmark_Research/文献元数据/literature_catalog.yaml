  translation_scope_evidence: "# GeoAgent：通过地理空间工具增强大语言模型的地址标准化能力\n\n**原题：** GeoAgent: To Empower LLMs using Geospatial\
    \ Tools for Address Standardization  \n**作者：** Chenghua Huang、Shisong Chen、Zhixu Li、Jianfeng Qu、Yanghua Xiao、Jiaxin\
    \ Liu、Zhigang Chen  \n**会议：** Findings of ACL 2024，第 6048–6063 页。  \n**代码：** https://github.com/chenghuahuang/GeoAgent\n\
    \n> 本文中文稿依照原文顺序整理摘要、第 1–5 节、局限性、致谢与附录要点；表中数字、地址示例、S2 token、数学公式、代码和原始提示词不作臆改。英文逐页完整提取稿另存于 `英文全文_逐页提取.md`；全部\
    \ 16 页原稿截图和 15 个图表截图随包提供。\n\n## 摘要\n\n现代导航地图、网约车、外卖配送和物流服务存在大量用户手动输入的非标准地址。这些地址往往含有信息缺失、拼写错误、口语化描述和方位偏移等不规范现象，给地址匹配和地址链接等下游任务带来困难。为此，本文提出\
    \ **GeoAgent**：一种由大语言模型（LLM）和地理空间工具集合共同构成的新框架。它利用 LLM 的语义理解能力，并通过专门地理工具融入空间知识，实现高效的地址标准化。\n\n为了验证方法的有效性和实用性，作者还构建了包含复杂非标准地址的大规模数据集，填补了既有数据集在此类任务上的空白，可用于训练和评估地址标准化模型。实验表明，GeoAgent\
    \ 能有效改善地址处理质量，并显著增强多个地址相关下游任务中模型的性能。\n\n## 1 引言\n\n随着 Google Maps、Uber、Uber Eats 和物流服务普及，用户输入的地址文本不断积累。但是，这些文本经常包含地址成分缺失、拼写错误、方向性位移描述或口语化描述等问题。图\
    \ 1 展示了三种看似不同但实际指向同一位置的表达：仅给出模糊道路名称的蛋糕店地址、位于两个道路交叉口西南方向 20 米的蛋糕店，以及位于某大学五号门对面的蛋糕店。它们都应被规范为同一条标准地址。为了实现这一点，模型必须既理解文本语义，也具备足够精确的空间知识。\n\
    \n![图 1：三类非标准地址示例（原图，PDF 第 1 页）](./images/figure-01-p001.jpg)\n\n*图 1 中文图题：三类非标准地址及其对应的标准地址，包括缺失或拼写错误、方向偏移描述和口语化位置描述。*\n\
    \n传统地址标准化方法通常依赖字符串匹配和人工规则，比如根据行政层级树拆分地址，再利用地址层级数据库补齐缺失成分。这些方法难以涵盖细粒度、多样化的口语表述。神经网络方法及地址"
