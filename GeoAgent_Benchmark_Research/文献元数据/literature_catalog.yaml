    \ Models*  \n> 作者：Shunyu Yao、Jeffrey Zhao、Dian Yu、Nan Du、Izhak Shafran、Karthik Narasimhan、Yuan Cao  \n> 会议：ICLR\
    \ 2023；上传版本 arXiv:2210.03629v3，共 33 页。  \n> **翻译范围说明**：下文按照原文结构译出研究动机、ReAct 范式、方法、实验、主要发现、相关工作、结论与附录的核心技术说明。参考文献及长篇原始提示词、逐轮工具调用和案例轨迹另外保留完整英文。由于这些长例子中部分内容采用中文解释而不是逐句对译，当前文档属于覆盖面较广的中文学术译述，**不能视为逐字完整译本**；请与\
    \ `英文原文_逐页.md` 对照阅读。\n\n## 摘要（中文翻译）\n\n尽管大语言模型（LLMs）在语言理解和交互式决策任务中展现了令人印象深刻的表现，但人们主要把其推理能力（例如思维链提示）与行动能力（例如行动计划生成）作为两个相对独立的研究主题。本文探索让\
    \ LLM **交错地生成推理轨迹和特定于任务的行动**，以增强二者的协同效应：推理轨迹帮助模型提出、跟踪和更新行动计划，并处理异常情况；行动则使模型能够与知识库或环境等外部来源交互，获取额外信息。我们将该方法命名为\
    \ **ReAct**，并把它应用于不同的语言任务和决策任务。实验表明，与先进基线方法相比，ReAct 有更好的表现，也提高了可解释性和可信度。具体而言，在问答（HotpotQA）和事实核验（FEVER）中，ReAct\
    \ 通过简单的 Wikipedia API 与外部知识交互，克服了思维链推理中常见的幻觉和错误传播，并形成比没有推理轨迹的基线更易理解、近似人类的问题求解轨迹。此外，在 ALFWorld 和 WebShop 两个交互式决策基准上，即使只有一两个上下文示例，ReAct\
    \ 相比模仿学习与强化学习方法仍分别取得 **34 个百分点和 10 个百分点**的成功率提升。\n\n## 1. 引言\n\n人类智能的一个显著特征，是能够自然地把目标导向行动与语言推理（或内部言语）结合起来。以做饭为例，我们会在具体操作之间用语言跟踪进度，例如“食材都切好了，现在应该烧水”；遇到问题时调整计划，例如“没有盐，可以改用酱油与胡椒”；在知识不足时主动检索，例如“面团该怎么揉？需要查看做法”。同时，打开食谱、查看冰箱和检查食材等实际行动又会给推理提供信息。推理与行动的紧密配合，让人能够应对新任务、外部不确定性和执行过程中的突发情况。\n\
