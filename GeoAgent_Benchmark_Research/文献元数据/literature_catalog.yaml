    ## 摘要（完整中文翻译）


    在遥感领域，除感知能力外，推理对于高级解译、推断和决策同样至关重要。大语言模型近期的发展使工具增强智能体能够利用外部工具执行复杂分析任务，但现有遥感研究主要关注感知型任务，针对认知层级地理空间推理的研究仍不充分。为填补这一空白，作者提出
    TerraLogic 地理空间推理基准。TerraLogic 包含 545 个以真实情景驱动、具备层次结构的任务，例如灾害脆弱性评估、城市热岛分析以及森林破碎化动态分析；任务覆盖光学、合成孔径雷达（SAR）和红外（IR）影像。它将评价目标由识别和监测扩展至认知层面的地理空间分析。为开展该基准上的评测，作者进一步提出工具增强智能体
    HieraPlan：将工具组合组织为功能层级，并执行具有故障容忍能力的推理。HieraPlan 支持结构化抽象、工具失败后的稳健恢复和长时程规划。大量实验表明，当前方法在分层地理空间推理上仍存在困难，而 HieraPlan
    在推理、跨模态泛化及错误处理方面提供了更强的基线。数据集和智能体代码均已公开。


