  translation_scope_evidence: "# AgentJudgeBench：面向智能体工具调用的多难度 LLM 评判器基准\n\n**原题**：*AgentJudgeBench: A Multi-Difficulty\
    \ Benchmark for Evaluating LLM Judges on Agentic Tool-Calling*  \n**作者**：Abhigya Verma、Amit Kumar Saha、Seganrasan\
    \ Subramanian、Sai Harshitha Aluru  \n**机构**：ServiceNow AI  \n**版本**：arXiv:2608.26623v1，2026-08-27  \n**原稿页数**：31\
    \ 页。\n\n> **译稿性质**：下文包含摘要的完整中文翻译和论文正文、方法、关键实验、局限及附录的详尽中文学术译述，**并非每一页逐句完整翻译**。特别是附录中的全部数值表、评分提示词和英文参考文献，已在 `AgentJudgeBench_英文全文逐页提取.md`\
    \ 中逐页保留，`source_pages/` 保存 31 页原稿图像，便于核对。所有模型名、函数、符号和原始数据不做推测性修正。\n\n## 摘要（完整翻译）\n\n大型语言模型（LLM）评判器已广泛用于评估智能体工具调用系统，但它们在**结构化、由依赖关系驱动的工作流**中的可靠性仍很少受到检验。本文提出\
    \ **AgentJudgeBench**，据作者所知，这是首个系统研究 LLM-as-a-judge 在工作流有向无环图（DAG）结构的智能体工具调用场景中可靠性的基准，其研究对象不同于开放式文本或偏好判断等更广义的\
    \ LLM-as-a-judge 任务。该基准包含 **3,808 个实例**，覆盖六种 DAG 拓扑结构与三个难度等级；评估涉及五个生成器（包括 3B–70B 的开放权重模型及 GPT-5.4）和六个评判器（从 20B\
    \ 到前沿规模），并分别设置**提供与不提供 Ground Truth（GT）**的成对条件。评判器与程序化参考结果的一致性随任务难度增加而单调下降，且在没有 GT 时下降速度快 **1.5 倍**。对于困难任务，在不提供\
    \ GT 时，无论模型规模如何，所有六个评判器的一致性均收敛到狭窄的 **77%–82%** 区间，显示出一个主要由任务难度驱动、但对较弱生成器而言其高度也部分依赖提示词的结构性上限；仅扩大模型能力无法消除这一上限。暴露\
    \ GT 并非总是有益：GPT-5.4 的一致性下降 **1.5 个百分点**，Gemini-2.5-Pro 下降 **3.9 个百分点**，与过度锚定（over-anchoring）现象一致。缓解手段方面，思维链推理和评判器温度几乎没有影响；结构化评价细则最多可提高\
    \ **6.5 个百分点**，但这种收益不会稳定地推广到所有评判器—生成器组合。存在 GT"
