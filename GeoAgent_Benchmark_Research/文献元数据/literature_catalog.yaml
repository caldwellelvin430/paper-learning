  translation_scope_evidence: "# 自主 GIS：下一代人工智能驱动的地理信息系统\n\n**英文题名：** Autonomous GIS: the next-generation AI-powered\
    \ GIS  \n**作者：** Zhenlong Li、Huan Ning（美国南卡罗来纳大学地理信息与大数据研究实验室）  \n**原稿信息：** 2023 年 5 月提交及更新；本文按 PDF 的 28 页顺序保留所有原始材料。\
    \  \n**术语约定：** Autonomous GIS 译为“自主 GIS”；LLM-Geo 为系统专名，不翻译；solution graph 译为“解法图/求解图”；operation node 译为“操作节点”；self-growing\
    \ 译为“自成长”。\n\n## 摘要\n\nChatGPT 等大型语言模型（Large Language Models，LLMs）具有较强的自然语言理解能力，已被探索应用于推理、创造性写作、代码生成、翻译和信息检索等领域。本文以\
    \ LLM 作为推理核心，提出**自主 GIS（Autonomous GIS）**：一种以人工智能驱动的地理信息系统，利用 LLM 的自然语言理解、推理与编码能力，通过自动收集空间数据、空间分析和可视化来解决空间问题。作者设想自主\
    \ GIS 应达到五个自主化目标，即**自生成（self-generating）、自组织（self-organizing）、自验证（self-verifying）、自执行（self-executing）和自成长（self-growing）**。研究在\
    \ Python 环境中调用 GPT-4 API，开发了称为 **LLM-Geo** 的原型系统，并通过三个案例说明自主 GIS 的形态以及它如何在无人干预的情况下产生预期结果。三个案例中，LLM-Geo 都能返回准确的聚合数值、图表和地图，显著缩短人工操作时间。虽然仍处于初期阶段，且尚缺少日志、代码测试等重要模块，LLM-Geo\
    \ 已展示出迈向下一代 AI 驱动 GIS 的可能路径。作者呼吁地理信息科学界投入更多资源研发自主 GIS，让空间分析更简单、更快速，并服务更广泛的使用者。\n\n**关键词：** 自主智能体；GIS；人工智能；空间分析；大语言模型；ChatGPT。\n\
    \n## 1 引言（Introduction）\n\n人工智能的发展催生了自主智能体（autonomous agents，也称 intelligent agents）。这类计算机系统能够在很少或没有人类参与的情况下执行任务、作出决策，在机器人、医疗、交通、金融等领域显示出应用潜力。其优点包括提高效率、减少错误，以及处理对人工来说耗时甚至难以完成的复杂任务。与根据既定命令、输入及环境条件执行预设操作的**自动化系统**（例如自动门、售货机）不同，**自主智能体**（例如扫地机器人、自动驾驶车辆）往"
