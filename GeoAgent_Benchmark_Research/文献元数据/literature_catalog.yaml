  translation_scope_evidence: "# EarthVerse：跨动态地球系统与自然灾害的科学智能体基准评测\n\n**英文标题：** EarthVerse: Benchmarking Scientific\
    \ Agents Across Dynamic Earth Systems and Natural Hazards  \n**作者：** Zhiqing Cui、Xinxiang Yin、Yihong Tang 等\
    \  \n**版本：** arXiv:2608.23525v1（2026 年 8 月 24 日），本次 PDF 46 页。\n\n> **译稿范围**：本文档提供摘要全文翻译以及正文主要观点、方法、指标、实验、结论的系统性中文译述，并非逐页逐段的全译本。原始论文全部英文与参考文献、补充材料、逐页高清截图及图表裁图保存在同一独立包，见\
    \ `英文原文_逐页.md`、`逐页原文与图表对照.md` 等文件。表中精确数值和附录案例请以原始截图复核。\n\n## 摘要（完整翻译）\n\n地球系统分析需要根据来源、尺度、采集时间和模态各不相同的观测记录，重建持续变化的物理过程。对于自然灾害，这一要求尤为重要，因为证据不完整可能改变对事件严重程度、受灾暴露程度与形成机理的估计。本文提出\
    \ **EarthVerse**，一个通过限定在事件资料包内的调查任务来评估科学智能体的基准。EarthVerse 的 **405 个可复现任务**来自 **199 起有文献记录的灾害事件**，涵盖 **19 类灾害**。\n\
    \n智能体需要浏览异构事件资料包、选择彼此兼容的证据、执行透明的计算、调和不同来源间的差异，并在最终答案中保留证据溯源。作者提供可执行的真实值（Ground Truth），将每道题分解成细粒度答案单元，同时配备任务专用的过程评分量规（rubric），在允许多种有效分析路径的前提下评估研究过程。论文在统一的工具使用协议下评价\
    \ **25 个模型和智能体系统**，并通过受控研究定位证据访问、工具选择、记忆、推理、交互和科学执行中的失败原因。\n\n实验中最佳平均答案单元准确率为 **84.65%**，而最高 **Strict@95** 仅为\
    \ **34.81%**。这一差距说明，当前智能体往往能够完成个别步骤，却难以在证据、时空尺度、单位、运算与物理解释之间维护一致的长链关系。EarthVerse 为衡量动态地球系统中端到端科学研究的可靠性提供了可复现的基础。\n\
    \n## 1. 引言：评价目标从“回答问题”转向“建立可审计证据链”\n\n地球系统科学研究大气、陆地、海洋、生态系统和人类活动的耦合作用。对一次灾害开展科学调查时，分析人员需要将机构报告、台站观测、卫星产品、再分析资料、地图与损失数据进行对照；这些资料可能在时间窗、空间支持尺度、变量含义、单位或观测目标上并不一致。因此，即使局部计算正确，如果选择了错误的时间区间，或把不同分辨率的统计量直"
