  translation_scope_evidence: "# AgentBoard：面向多轮大语言模型智能体的分析式评估平台\n\n**原文标题**：AgentBoard: An Analytical Evaluation\
    \ Board of Multi-turn LLM Agents  \n**作者**：Chang Ma、Junlei Zhang、Zhihao Zhu、Cheng Yang、Yujiu Yang、Yaohui Jin、Zhenzhong\
    \ Lan、Lingpeng Kong、Junxian He  \n**发表信息**：NeurIPS 2024 Datasets and Benchmarks 赛道  \n**开源代码与数据**：`https://github.com/hkust-nlp/AgentBoard`\
    \  \n**原稿 PDF**：38 页。\n\n> **翻译范围**：对摘要、正文第 1—7 节、核心指标公式、九种环境、实验结论、局限性以及重要附录表格作了详细中文译述；所有原始图表、提示词与 API 文本的英文均完整保留在配套材料中。附录\
    \ N 中的大量运行指令和逐轮演示、参考文献书目信息未逐句译完。故本文件是**有原文逐页对照的详细中文译述**，不是 38 页严格逐句全文汉化版。\n\n## 摘要（中文翻译）\n\n将大语言模型（LLM）作为通用智能体进行评估，对于理解其能力并推动其融入实际应用十分重要。然而，这一评价过程面临巨大挑战。其一，如何在统一框架中对跨越多种场景的智能体表现进行基准测试，尤其是如何维护**部分可观测的环境**并支持**多轮交互**；其二，现有评价框架大多只关注最终任务成功率，对任务执行过程的揭示十分有限，难以深入理解模型的能力。\n\
    \n为此，作者提出 **AgentBoard（AGENTBOARD）**，一种面向 LLM 智能体的综合基准及开源分析式评估框架。AgentBoard 提出细粒度的**进度率（Progress Rate）**指标，以捕捉智能体执行过程中逐步取得的进展，并提供能够从多个角度进行分析的完整评估工具。它不仅能揭示\
    \ LLM 智能体的能力与局限，也将模型表现的可解释性置于评价中心。研究希望借此帮助理解智能体行为，并促进更强大智能体的发展。\n\n## 1. 引言（中文译述）\n\n能够自主感知不同环境并采取行动的通用智能体，是人工智能领域的重要发展目标。近年来，LLM\
    \ 在语言理解、规划以及多轮交互方面出现新能力，带动了基于语言模型的自主行动系统。但智能体评价不能照搬单轮问答任务：真实应用往往要求模型与环境反复互动、获得不完整观察、探索未知状态，并在多步操作中持续调整计划。\n\n\
    作者指出，多数现有基准未能同时覆盖**任务多样性、多轮交互、部分可观测性和过程评价**。仅统计最终任务成功率的做法尤其存在问题：对于困难任务，多个模型的最终成功率可能都接近零，但其中有的模型已完成大部分子目标，另一"
