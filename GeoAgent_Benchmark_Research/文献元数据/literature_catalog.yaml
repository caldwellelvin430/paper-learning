  translation_scope_evidence: "# SWE-bench：语言模型能解决真实世界的 GitHub 问题吗？\n\n> **原题**：SWE-bench: Can Language Models Resolve\
    \ Real-World GitHub Issues?  \n> **作者**：Carlos E. Jimenez、John Yang、Alexander Wettig、Shunyu Yao、Kexin Pei、Ofir\
    \ Press、Karthik Narasimhan  \n> **机构**：普林斯顿大学、Princeton Language and Intelligence、芝加哥大学  \n> **发表**：ICLR 2024。原文注明\
    \ Carlos E. Jimenez 与 John Yang 同等贡献。  \n> **说明**：原论文共 51 页。为科研可复现性，测试命令、补丁、仓库路径、模型名称和英文原始 issue 文本均保留原样；中文翻译采用章节组织，所有原文页面、图表和示例代码另行完整收录。原文发表时的模型分数反映当时实验，不代表当下成绩。\n\
    \n## 摘要（原稿第 1 页）\n\n语言模型的发展已经超越了我们有效评估其能力的水平，但为了推动未来研究，我们必须探索它们的能力边界。我们发现，真实世界的软件工程是评价下一代语言模型的一种丰富、可持续且具有挑战性的试验场。为此，我们提出\
    \ **SWE-bench**：一个评估框架，包含来自 **12 个**常用 Python 代码仓库的真实 GitHub issue 及对应 Pull Request（PR）构建的 **2,294 个**软件工程问题。给定代码仓库及待解决问题的描述，语言模型需要修改代码库来解决相应问题。SWE-bench\
    \ 中的问题常常要求同时理解和协调多个函数、类，甚至多个文件之间的变化，因此模型需要与执行环境交互、处理极长上下文，并进行远超传统代码生成任务的复杂推理。实验表明，无论当时最先进的闭源模型还是我们微调的 SWE-Llama，都只能解决其中最简单的问题。表现最佳的\
    \ Claude 2 也仅解决 **1.96%** 的任务。SWE-bench 的进展将推动语言模型变得更加实用、智能和自主。\n\n## 1 引言（原稿第 1–2 页）\n\n语言模型正快速部署到聊天机器人、代码助手等商业产品中。与此同时，许多已有基准已经趋于饱和（Kiela\
    \ et al., 2021；Ott et al., 2022），难以衡量最先进模型究竟能做什么、不能做什么。我们需要更有挑战性、能更真实反映语言模型实际应用的评测基准，从而引导未来模型的发展与使用（Srivastava\
    \ et al., 2023）。\n\n![图 1 SWE-bench 任务与验证过程](./images/figure-01-p01.png)\n\n*图 1：SWE-bench 通过把真实 P"
