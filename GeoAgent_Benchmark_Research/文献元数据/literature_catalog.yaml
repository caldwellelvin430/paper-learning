  translation_scope_evidence: "# DS-1000：面向数据科学代码生成的真实且可靠的基准\n\n**英文题名：** DS-1000: A Natural and Reliable Benchmark\
    \ for Data Science Code Generation  \n**作者：** Yuhang Lai、Chengxi Li、Yiming Wang、Tianyi Zhang、Ruiqi Zhong、Luke\
    \ Zettlemoyer、Wen-tau Yih、Daniel Fried、Sida Wang、Tao Yu  \n**出处：** ICML 2023，PMLR 202。  \n**术语约定：** *natural*\
    \ 译为“真实自然的”（指真实用户需求），*multi-criteria execution-based evaluation* 译为“多准则执行式评测”，*surface-form constraints* 译为“表层形式约束”，*perturbation*\
    \ 译为“扰动”，*infilling* 译为“中间填充”。\n\n## 摘要\n\n本文提出 **DS-1000**，一个面向数据科学代码生成的基准，包含来自 NumPy、Pandas 等 **7 个 Python\
    \ 库**的 **1,000 道数据科学问题**。与已有工作相比，DS-1000 具有三个核心特点。首先，题目收集自 StackOverflow，因此反映了多样、真实且具有实际用途的用户需求。其次，自动评价具有较高的判别准确性：在\
    \ Codex-002 预测且被评价器判为正确的代码中，仅有 **1.8%** 经人工检查后实际不正确。为此，作者采用多准则指标，既通过执行测试用例检查**功能正确性**，又通过限制 API 使用或关键词等方式检查**表层形式约束**。最后，作者主动防范模型记忆训练数据中的标准答案，通过对原始\
    \ StackOverflow 问题进行小幅修改，使模型无法仅凭复述预训练中见过的解法通过测试。当时表现最好的公开模型 Codex-002 在 DS-1000 上的准确率为 **43.3%**，说明这一方向仍有很大进步空间。基准公开于\
    \ <https://ds1000-code-gen.github.io>。\n\n## 1 引言（Introduction）\n\n数据科学对许多领域都很重要，但使用者需要掌握专业编程工具与库，这给非专业用户造成较高门槛。预训练代码生成模型可能降低这一门槛：例如\
    \ Codex 已能较准确地补全短 Python 代码，AlphaCode 也能处理困难的竞赛编程题。如果这类模型在实际数据科学问题上持续取得进展，普通用户使用数据分析工具的障碍有望降低。\n\n然而，目前仍缺少同时满足三个条件的评测基准：（1）聚焦**日常数据科学应用**；（2）包含真实自然的用户意图与上下文；（3）使用**可靠的、基于程序执"
