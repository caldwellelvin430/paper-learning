  translation_scope_evidence: "# GeoBenchX：面向智能体求解多步骤地理空间任务的大语言模型基准评测\n\n**作者：** Varvara Krechetova（世界银行，美国纽约）；Denis\
    \ Kochedykov（摩根大通，美国纽约）  \n**发表：** ACM SIGSPATIAL GeoGenAgent '25，2025 年 11 月 3—6 日，美国明尼阿波利斯  \n**DOI：** [10.1145/3764915.3770721](https://doi.org/10.1145/3764915.3770721)\
    \  \n**开源仓库：** https://github.com/Solirinai/GeoBenchX\n\n> 译名对照：tool calling = 工具调用；reference solution = 参考解；candidate\
    \ solution = 候选解；LLM-as-Judge = 大语言模型裁判；match / partial match / no match = 匹配／部分匹配／不匹配；solvable / unsolvable\
    \ = 可求解／不可求解；ground truth = 真实值／标准答案（依上下文）。本文中的 *match rate* 指由参考解匹配评估所得的比例，不能自动等同于真实 GIS 环境中的执行成功率。参考文献保留原文书目信息，便于准确检索。\n\
    \n## 摘要\n\n本文构建了一个基准，用于评估大语言模型（LLM）在与商业 GIS 从业人员相关的多步骤地理空间任务中的工具调用能力。研究采用一个配备 23 项地理空间功能的简洁工具调用智能体，评估 Claude\
    \ Sonnet 3.5 和 4、Claude Haiku 3.5、Gemini 2.0 Flash、Gemini 2.5 Pro Preview、GPT-4o、GPT-4.1 以及 o4-mini 等商业模型。基准任务按照复杂度分为四类，既包含可求解任务，也包含专门设计的不可求解任务，以测试模型的拒绝能力。作者开发了一个以\
    \ LLM-as-Judge 为基础的评估框架，将智能体给出的候选解与参考解进行比较。结果表明，o4-mini 和 Claude 3.5 Sonnet 总体表现最佳；GPT-4.1、GPT-4o 和 Gemini 2.5\
    \ Pro Preview 也有较强表现，其中后两者在识别不可求解任务方面相对更有效。Claude Sonnet 4 倾向于给出任意形式的解答而不是拒绝任务，因此准确率较低。不同模型的 Token 消耗存在显著差异，Anthropic\
    \ 模型通常消耗更多 Token。典型错误包括误解几何关系、依赖过时的世界知识以及低效的数据操作。作者开源了基准任务集、评估框架及数据生成管线，为 GeoAI 中 LLM 的持续评测提供一种标准化途径。\n\n**关键词：**\
    \ 大语言模型"
