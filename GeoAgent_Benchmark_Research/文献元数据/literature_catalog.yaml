  translation_scope_evidence: "# GeoNatureAgent（GNA）：面向地理空间与环境任务工具型智能体的部署前评估框架与基准\n\n**英文原题：** GeoNatureAgent (GNA):\
    \ A Framework and Benchmark for Pre-Production Evaluation of Tool-Using Agents on Geospatial and Environmental\
    \ Tasks  \n**作者：** Gabriel Diaz-Ireland、Diego Prieto-Herráez、Mario García Peces 等。  \n**原稿：** 10 页；GeoIndustry\
    \ '26。\n\n> **译文范围提示：** 以下是摘要全文翻译及正文核心内容的顺序中文译述，工具 API 名称、代码路径、参数与指标名称保留英文，便于核验。完整英文原文、所有参考文献和跨栏表格截图保留在同包；本文未将所有原文段落逐词汉化。\n\
    \n## 摘要（全文翻译）\n\n在将具备工具调用能力的大语言模型智能体部署到环境与地理空间工作流之前，开发团队需要证据证明智能体能够可靠地选择适当的操作，并与真实 API 正确交互。然而，目前缺少可复用、自托管的部署前评估基础设施。本文提出\
    \ **GeoNatureAgent（GNA）**，一种面向工具型智能体的部署前评估框架。GNA 将固定的 **16 工具**地理空间接口（12 项主要操作、4 项辅助操作）以 **Model Context Protocol（MCP）**服务器的形式发布，使被测智能体成为唯一变化因素：任何兼容\
    \ MCP 的客户端都可以直接接入，并由相同的工具层、任务集合和确定性评分器进行评价。\n\n该框架的旗舰实例是包含 **103 道任务**的基准，其中有覆盖 **18 个类别的 93 道主测试任务**和 **10\
    \ 道比较类扩展任务**。任务涉及工具选择、多轮对话、空间推理、跨指标综合、错误处理、多语言理解、任务拒绝等能力，并在面向西班牙和葡萄牙三类环境指标的开放式自托管地理空间 API 上执行。作者在 Vertex AI、OpenRouter\
    \ 和 Anthropic 平台上比较了九个大型语言模型，每个模型以温度 1.0 运行三个不同随机种子，并把任务能力与每题成本作为正交维度分别报告。\n\n实验结果表明：（1）Claude Sonnet 4 在全部\
    \ 103 题上取得最高的 **61.7% ± 0.7%** 能力准确率（93 题主集为 **60.8% ± 0.8%**），DeepSeek V3.2 以 **57.9% ± 3.9%** 紧随其后，其余模型都未超过\
    \ 53%；（2）成本—准确率帕累托前沿主要由开放权重模型占据，DeepSeek V3.2 以 **11.3 倍更低的标价成本**达到 Claude 约 93% 的能力，"
