  translation_scope_evidence: "# 灾害应急行动中大语言模型智能体的异构地理空间推理评测\n\n**英文标题：** Can LLM Agents Respond to Disasters? Benchmarking\
    \ Heterogeneous Geospatial Reasoning in Emergency Operations  \n**作者：** Junjue Wang、Weihao Xuan 等  \n**研究对象：**\
    \ Disaster Operational Response Agent Benchmark（DORA）  \n**论文版本：** NeurIPS 2026（Evaluations and Datasets Track,\
    \ Oral）；本次上传的 PDF 共 13 页。\n\n> **译稿范围说明**：本文档是依据原文形成的**中文重要章节翻译与系统性学术译述**，并非对全部页码逐句逐字的完整译文。原始英文全文（含完整参考文献）、全部\
    \ PDF 页面、原图与表格均完整保存在同一资料包。具体可查阅 `英文原文_逐页.md`、`英文全文_连续文本.txt`、`逐页原文与图表对照.md`。图表截图按实际 PDF 页码定位。\n\n## 摘要（中文翻译）\n\
    \n真正的灾害应急行动远不止灾损评估：应急人员还必须整合多传感器信号，对道路网络、人口和关键设施开展推理，规划疏散方案，并形成具有可操作性的报告。然而，以往研究大多将遥感感知单独评估，或仅考察一般性的工具使用能力，尚未充分探索灾害应急行动的端到端工作流。为弥补这一空白，本文提出**灾害行动响应智能体基准\
    \ DORA**，这是一个面向端到端灾害响应的智能体评测基准。DORA 包括基于 **45 起真实灾害事件、覆盖 10 类灾害的 515 道专家编制任务**，配有经过专家验证、可重放的标准轨迹，共计 **3,500\
    \ 个工具调用步骤**。\n\nDORA 的任务涵盖应急响应工作流的五个维度：灾害感知、空间关系分析、灾害行动规划、时间演化推理，以及多模态报告综合。智能体通过包含 **108 种工具**的模型上下文协议（MCP）工具库，对异构地理空间数据进行组合操作。数据包括单时相、双时相和多时相的光学、合成孔径雷达（SAR）与多光谱影像，地面采样距离（GSD）覆盖\
    \ **0.015—10 米**，并辅以高程数据及社会地理空间矢量图层。\n\n作者评估了 13 个前沿大语言模型，发现三项持续存在的挑战。第一，灾害领域的语义锚定产生独有的失败模式，包括灾损语义理解错误、传感器模态不匹配及灾害处理流程组合错误。第二，智能体同时受制于**工具选择**和**参数锚定**；即便提供正确工具调用顺序作为提示，最终准确率也仅提高\
    \ **1.08—4.40 个百分点**，采用其他 Agent 脚手架所得最大增益也只有 **3.24 个百分点**。第三，流程越长，组合推理越脆弱；在长流"
