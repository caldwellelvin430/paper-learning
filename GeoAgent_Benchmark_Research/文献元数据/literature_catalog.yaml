  translation_scope_evidence: '# GEOBench-VLM：面向地理空间任务的视觉语言模型基准


    > **翻译范围说明**：摘要完整翻译；正文中关于任务分类、数据构建、实验与指标的内容为重点译述，非全部正文逐句翻译。


    ## 原文摘要｜完整中文翻译


    近年来已有大量基准用于评价通用视觉语言模型（Vision-Language Models，VLMs），但它们并不能有效应对地理空间应用所特有的挑战。通用 VLM Benchmark 并不是针对地理空间数据的复杂性设计的，而地理空间数据对环境监测、城市规划和灾害管理等应用至关重要。该领域的主要困难包括时间变化检测、大规模目标计数、微小目标检测，以及理解遥感影像中不同实体之间的关系。为填补这一空白，作者提出
    GEOBench-VLM：一个专门面向地理空间任务评价 VLM 的综合基准，覆盖场景理解、目标计数、定位、细粒度分类、分割和时序分析等任务。该基准包含一万多条经人工验证的指令，涵盖多种视觉条件、目标类型和尺度。作者使用这一基准评价多种先进视觉语言模型，以考察它们在地理空间任务中的能力。结果显示，现有
    VLM 虽然具有潜力，但面对地理空间特有任务时仍存在明显困难。表现最好的 LLaVA-OneVision 在多项选择题（MCQ）上的准确率仅为 41.7%，略高于 GPT-4o，约为随机猜测水平的两倍。基准数据已在论文注明的
    GitHub 仓库公开。


    ## 任务分类｜重点译述


    GEOBench-VLM 将 31 种细粒度任务组织为 8 类地理空间视觉任务。论文的第一张示意图包含场景理解、目标分类、事件检测、目标定位与计数、图像描述、分割、非光学影像理解、时序理解等内容。题目既包括需要选择唯一正确答案的客观题，也包括对影像内容的描述或感知输出。


    不同任务对空间尺度和视觉细节的要求显著不同。微小目标定位、相邻对象关系、灾害事件识别与跨时相变化等问题，不能简单用通用自然图像测试集上的成绩加以替代。


    ## 评测设计与发现｜重点译述


    作者基于多源遥感数据、人工验证的指令与多种任务设置比较现有 VLM。不同任务采用与其输出形式相适配的评测方式，包括多项选择题准确率，以及与定位、分割和描述相关的指标。对于严谨的横向比较，应当分开统计各任务的结果，不能将“VLM
    的视觉理解分数”直接理解为“Agent 的工具调用成功率”。


    ## 对研究的定位


    该论文适合作为**感知层、地理空间视觉理解层**的 Benchmark 参照。它不以复杂 GIS 工具执行轨迹为主要评价对象，因此与你关注的工具参数、任务执行、GT 产物一致性存在评价层级差异。它可以成为对照论文，用于阐明“静态感知基准”与“可执行地学智能体基准”的边界。


    ## 图表阅读提示


    - **图 1**：八类、31 项地理空间视觉语言评测任务的例子。

    - **图 2–3**：基准内容与数据构建流'
