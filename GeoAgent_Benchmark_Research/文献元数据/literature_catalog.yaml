  translation_scope_evidence: "# 地理空间代码生成大模型的评估\n\n**原题：** Evaluation of Code LLMs on Geospatial Code Generation\
    \  \n**作者：** Piotr Gramacki、Bruno Martins、Piotr Szymański  \n**发表：** GeoAI’24（第七届 ACM SIGSPATIAL 地理知识发现人工智能国际研讨会），2024\
    \ 年 10 月 29 日—11 月 1 日，美国亚特兰大。  \n**DOI：** 10.1145/3687123.3698286  \n**复现仓库：** https://github.com/kraina-ai/geospatial-code-llms-dataset\n\
    \n> 本稿依照原文的章节顺序翻译论文主体（摘要及第 1–5 节）；模型标识符、Python 语法和文献著录保持英文。全部 9 页英文文本在 `英文全文_逐页提取.md`，原论文及每页截图亦附于压缩包。图表保持原文截图，提供中文解读。\n\
    \n## 摘要\n\n人们很早就开始研究软件开发辅助工具，近年来的研究开始利用大语言模型（Large Language Models，LLMs）生成代码。这些模型能够为数据科学和机器学习应用生成 Python 代码。LLM\
    \ 可以提高软件工程师日常工作的生产效率，也能为经验不足的开发者充当“导师”，成为可行的学习辅助工具。利用 LLM 生成高质量代码同样有益于地理空间数据科学。然而，地理空间领域面临与通用代码生成不同的挑战，而代码生成\
    \ LLM 通常并未接受地理空间任务的专门评估。\n\n本文介绍如何通过选择一组地理空间任务，为代码生成模型构建评估基准。研究人员根据任务复杂度和所需工具对地理空间任务进行分类，进而设计数据集，以考察模型在**空间推理、空间数据处理和地理空间工具使用**方面的能力。数据集由人工精心编制的具体编程问题组成，以保证质量。每道题均配有一组测试情形，以自动检查生成代码的正确性。作者还利用这一数据集测试了多种现有代码生成大模型在地理空间领域的表现，并将数据集和可复现的评估代码公开在\
    \ GitHub 仓库中，希望它能成为今后评估新模型的基准，并推动能够高准确率解决地理空间编码任务的专用模型与智能编程助手的发展。\n\n**ACM CCS 概念：** 计算方法—自然语言处理；信息系统—地理信息系统；以人为中心的计算—自然语言接口。\
    \  \n**关键词：** 地理空间数据科学、代码生成、大语言模型。\n\n## 1 引言\n\n如今，大语言模型已能够有效应用于代码生成，尤其适用于较常见的编程语言及领域，例如面向数据科学和机器学习的 Python\
    \ 编程。这类能力能够辅助专家编写代码，提高工作效率；同时，模型能够根据自然语言问题描述返回代码示例，为初学者提供学习支持。这些优势也可以扩展到地理空间数据科学。"
