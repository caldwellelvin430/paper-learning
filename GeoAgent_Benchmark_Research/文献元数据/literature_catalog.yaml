    ## 摘要（完整中文翻译）


    地球观测（Earth Observation，EO）为环境监测、灾害管理、气候科学及其他科学领域提供关键的全球数据。本文提出一个问题：现有人工智能系统是否已经能够可靠地进行地球观测分析？为回答这一问题，作者提出 UnivEARTH——一个基于
    NASA Earth Observatory 文章构建的代码生成评测基准，包含 408 道“是/否”问题，涉及 7 类主题和 15 种以上卫星仪器及数据来源。在零样本设置下，将 Google Earth Engine（GEE）API
    作为工具时，大语言模型智能体的正确率仅为 40.0%，且超过 44% 的情况下生成的代码无法运行。为进一步理解模型行为，作者比较了 JavaScript 与 Python 版本 API 的影响，并考察提供文档资料的作用。此外，实验发现引入
    Reflexion 反思机制能够显著减少错误：Claude-4.5-Sonnet、Gemini-2.5-Pro 和 GPT-5 的正确率可提升到约 60%。不过，这一结果仍仅略高于随机猜测水平。总体而言，研究指出自动化地球观测之前仍需解决若干重要挑战，同时提出了可能的改进方向。数据集已经公开。


    ## 主要研究章节（中文学术译述）



    ### 研究目标与任务边界


    UnivEARTH 评价的不仅是模型知道多少地球科学知识，更是模型能否根据自然语言问题选择正确的数据集、空间范围、时段和波段，编写能够在 Google Earth Engine 环境运行的代码，并由计算结果支撑判断。由于问题设计为“是/否”，其随机猜测基线约为
    50%，因此对准确率的解释需结合生成代码能否执行和结果是否有证据支撑。


    ### Benchmark 数据来源


    作者以 NASA Earth Observatory 科普与观测文章为问题来源，通过人工样例、辅助生成、GEE 可回答性检验和独立人工审核形成 408 个高质量二元问题，覆盖 7 个地球科学主题和 15 种以上数据来源。每一问题都要能够落地为真实的遥感数据查询与计算，而非只依赖语言模型记忆。


