    \ Agentic Benchmarks  \n**作者：** Yuxuan Zhu 等。  \n**原稿：** 41 页。本文保留方法名称、评价代号、数值、引文标号及源代码标识。\n\n> **译文范围提示：**\
    \ 以下为论文摘要和主文核心章节的中文译文与按原文组织的技术译述，并非 41 页逐句译本。英文逐页全文、全部附录、参考文献和原稿页图单独保留；未译内容不标记为“已译”。\n\n## 摘要（全文翻译）\n\n基准测试对于定量跟踪人工智能的发展至关重要。随着\
    \ AI 智能体能力不断增强，研究人员与实践者开始提出智能体基准测试（agentic benchmarks），以评价智能体完成复杂现实任务的能力。这些基准通常通过特定的奖励设计对任务结果评分，从而衡量智能体能力。然而，我们发现，许多智能体基准在任务配置或奖励设计方面存在问题。例如，SWE-bench-Verified\
    \ 采用的测试用例不足，而 τ-bench 将空响应计为成功。这些问题可能造成智能体性能的相对高估或低估，幅度最高达到 100%。为使智能体评估更加严谨，我们提出 **Agentic Benchmark Checklist（ABC，智能体基准测试检查清单）**，将团队构建基准的经验、最佳实践调查及已报告的问题综合为可操作的指导原则。将\
    \ ABC 用于评估设计特别复杂的 CVE-Bench 后，性能高估幅度下降了 **33%**。\n\n## 1 引言\n\n随着智能体开始结合模型、工具、记忆与外部知识解决现实问题，评价其能力与风险的基准测试日益重要。然而，智能体基准测试明显比传统分类或固定输出任务更加复杂。首先，智能体输出常常是自由文本、代码、命令执行结果或者环境状态变化，无法仅通过固定类别标签判断正误。其次，真实任务依赖浏览器、操作系统、数据库和外部\
    \ API 等复杂环境；环境设计本身就可能产生漏洞或不稳定因素。因此，分数是否准确反映智能体能力，必须经过独立验证。\n\n作者指出，**SWE-bench-Verified 的测试集可能无法覆盖补丁的关键边界情况**，导致错误补丁通过测试；在\
    \ τ-bench 的某些本来不可完成的任务中，“保持环境不变”被视为成功，因而什么都不做的智能体也可能得到较高分数。论文报告，该简单策略在 τ-bench 的相关实验中达到了 **38% 成功率**，足以说明“通过检查”不必然等同“具备目标能力”。\n\
