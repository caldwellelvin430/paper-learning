  translation_scope_evidence: "# GISAgentBench：基于 GIS 从业者真实问题的 LLM 智能体 GIS 任务评测基准\n\n> **英文原题**：GISAgentBench: A\
    \ Practitioner-Sourced Benchmark for Evaluating LLM Agents on GIS Tasks  \n> **作者**：Abhinav Pothuri¹、Zhe Jiang¹*、Zelin\
    \ Xu¹、Di Yang²  \n> **单位**：¹美国佛罗里达大学计算机与信息科学及工程系；²美国佛罗里达大学地理系  \n> **通讯作者**：Zhe Jiang，zhe.jiang@ufl.edu  \n\
    > **原稿**：arXiv:2608.01645v1 [cs.AI]，2026 年 8 月 3 日。原 PDF 共 **29 页**。  \n> **翻译约定**：保留 GIS、CRS、NoData、GT、LLM、VLM、API、ReAct、TSR、QCS、IoU、sMAPE\
    \ 等缩写及程序标识符；译文中的“真实值 / 基准真值”对应 *ground truth*，“轨迹”对应 *trajectory*，“工具执行框架”对应 *harness*。图表保留论文原图，并在下方提供中文标题和必要的内容翻译。表格的行列和数值以原图为最终核对依据。\n\
    \n## 摘要（原文第 1 页）\n\n地理信息系统（Geographic Information System，GIS）专业人员依赖多步骤空间分析工作流，为城市规划、灾害响应及环境监测中的决策提供支持。然而，这些工作流程繁琐、耗时且容易出错。尽管近期具备外部工具使用能力的大语言模型（Large\
    \ Language Model，LLM）智能体有望实现地理空间分析自动化，但它们执行真实 GIS 工作流的能力仍缺乏充分研究。现有 GIS 智能体基准测试数据集大多来自教科书、教程或由 LLM 生成的初始任务，在规模和执行轨迹深度方面均存在限制。更重要的是，这些基准没有提供真实值输出（ground\
    \ truth outputs），因而只能依赖代码相似度、轨迹匹配或 LLM/VLM 裁判等替代性评价信号，可能将工作流表面上的相似误认为任务结果正确。\n\n为弥补这一缺口，我们提出 **GISAgentBench**：一个包含\
    \ **349 项多步骤 GIS 任务**的基准测试集。任务从 GIS Stack Exchange 真实从业者问题中整理而来，并在六个选定地理研究区域的真实公开数据上实例化。每项任务均配备可执行的参考轨迹以及精确的真实值输出文件，使得评估能够超越\
    \ LLM 裁判，直接进行严格、确定性且具有容差意识的输出匹配。对六种 LLM 模型的评估表明，真实 GIS 工作流仍极具挑战性：在严格容差评分下，表现最好的智能体仅完成了 **32.7%** 的任务，尽"
