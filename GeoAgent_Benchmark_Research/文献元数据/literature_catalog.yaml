  translation_scope_evidence: '# GeoLLM-Engine：用于构建地理空间 Copilot 的真实环境


    > **翻译范围说明**：以下摘要完整翻译，方法及实验为准确性优先的节译和概述；完整英文逐页原文及参考文献另附。


    ## 原文摘要｜完整中文翻译


    地理空间 Copilot 使用户能够通过自然语言指令开展地球观测应用，释放了前所未有的潜力。然而，现有智能体往往依赖过度简化的单项任务以及基于模板生成的提示，与真实场景之间存在明显脱节。本文提出 GeoLLM-Engine：一种面向工具增强智能体的环境，支持遥感平台分析人员日常执行的复杂任务。作者为该环境集成了地理空间
    API 工具、动态地图和用户界面，以及外部多模态知识库，以正确评价智能体理解真实高层自然语言命令的能力和完成任务时的功能正确性。为了减轻通常由人工参与基准构建带来的开销，作者利用 100 个 GPT-4-Turbo
    节点组成的大规模并行引擎，将基准扩展到超过五十万个多工具任务及一百一十万幅卫星影像。该研究突破了传统单任务图像描述范式，并使用长时程提示比较先进智能体和提示策略。


    ## 研究动机｜节译


    作者认为，研究中的关键问题并不是不断增加同质化图像描述和问答样本，而是构建真实、可交互、包含多种地理空间工具的任务环境。这样才能考察 Agent 是否理解用户的高层意图、能否选择正确工具，以及最终是否真正完成任务。


    ## 环境架构｜重点译述


    GeoLLM-Engine 集成地理空间 API、动态地图与 Web UI、外部知识源，以及工具增强的智能体执行链。研究任务不仅包括物体检测、土地覆盖识别和场景总结，还包括影像变化分析、知识检索、地图可视化、Web
    操作和文档查询。复杂任务可能需要多个工具以及不同层次的任务计划。


    在 Benchmark 生成阶段，作者使用程序化工具与大规模并行模型生成扩展任务库；在评价阶段采用与工具环境有关的**模型检查机制（model checks）**，判断智能体执行是否满足预期功能，而不只比较自然语言答案的表面相似程度。


    ## 实验与评价机制｜重点译述


    论文测试了不同模型与提示方法，并讨论任务规模、任务复杂度对评价结论的影响。作者特别指出：如果只增加相同难度的大量样本，评测结果的区分度未必得到提升；而增加任务类型和复杂程度，能够更全面地暴露 Agent 的不足。这一观点可以直接用于地学
    Benchmark 的“覆盖度不等于有效性”讨论。


    ## 图表阅读提示


    - **图 1**：真实遥感业务场景的任务类别及自然语言指令示例。

    - **图 2**：包含 API、地图工具、评测引擎和检查机制的系统架构。

    - **表 1**：GeoLLM-Engine 的工具模块清单。

    - **表 3**：用于判断智能体操作结果的 model checks。



    ## 核心学术术语对照


    | 英文术语 '
