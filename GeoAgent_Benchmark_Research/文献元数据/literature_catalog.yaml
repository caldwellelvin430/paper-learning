    \n> **译文范围声明**：摘要及主要研究章节为中文译文或紧贴原文的分节译述；长篇技术附录、示例对话和参考文献尚未逐行翻译。全文英文内容见 `英文原文_逐页完整提取.md`，所有原稿页面见 `source_pages/`。保留代码、参数名与模型名原文，以维护可复现性。\n\
    \n## 摘要（中文翻译）\n\n大型语言模型（LLM）的最新进展激发了人们对使用工具辅助 LLM 解决现实世界问题的研究兴趣，这也要求研究者对模型的工具使用能力进行全面评价。既有研究往往仅评估基于无状态 Web 服务（RESTful\
    \ API）的单轮用户请求，或基于预先收集、与当前策略无关的离线对话轨迹。与之不同，**ToolSandbox** 引入有状态工具执行、工具之间隐含的状态依赖、支持基于当前策略开展对话评估的内置用户模拟器，以及能够在任意交互轨迹上动态评价中间和最终里程碑的策略。实验表明，开源模型与专有模型之间存在明显的性能差距；与此同时，ToolSandbox\
    \ 定义的状态依赖（State Dependency）、规范化（Canonicalization）和信息不足（Insufficient Information）等复杂任务，即使对性能最强的模型也仍具有挑战性。这些结果为理解\
    \ LLM 的工具使用能力提供了新认识。\n\n## 1 引言\n\n大语言模型的进步使它们能够作为自主智能体观察环境、理解自然语言目标，并调用现实世界的 API 完成复杂任务。与传统对话状态跟踪中要求模型按照预定义本体显式产生对话状态和动作不同，工具调用智能体往往直接依据观察生成工具调用，在内部隐式维护对话状态和世界状态。因此，**工具之间的状态关联、持续多轮对话和执行中的不确定性**构成了评价系统必须面对的问题。\n\
    \n许多工具调用基准依赖无状态服务或单轮、无歧义的请求。即使能够修改环境状态，也未必考察工具之间的隐式依赖"
