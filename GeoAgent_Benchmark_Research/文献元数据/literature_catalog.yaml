  translation_scope_evidence: "# VOYAGER：基于大语言模型的开放式具身智能体\n\n> **原题**：VOYAGER: An Open-Ended Embodied Agent with\
    \ Large Language Models  \n> **作者**：Guanzhi Wang、Yuqi Xie、Yunfan Jiang、Ajay Mandlekar、Chaowei Xiao、Yuke Zhu、Linxi\
    \ “Jim” Fan、Anima Anandkumar  \n> **机构**：NVIDIA、Caltech、UT Austin、Stanford、UW Madison  \n> **论文版本**：arXiv:2305.16291v2（2023年10月19日）；PDF\
    \ 42页  \n> **项目**：https://voyager.minedojo.org  \n> **译文说明**：依原稿顺序翻译正文、表格标题、图注、实验结果和技术说明。保留 API、JavaScript 函数名、JSON\
    \ 字段及程序代码原样，完整英文逐页提取见 `英文原文_逐页提取.md`。\n\n## 摘要（Abstract）\n\n本文介绍 **VOYAGER**，作者称其为第一个由大语言模型（LLM）驱动、在《我的世界》（Minecraft）中开展**具身终身学习（embodied\
    \ lifelong learning）**的智能体。它可以在没有人类干预的情况下持续探索世界、获得各种技能，并不断发现新事物。\n\nVOYAGER 由三个关键部分组成：（1）最大化探索的**自动课程（automatic\
    \ curriculum）**；（2）不断增长的**技能库（skill library）**，以可执行代码形式存储和检索复杂行为；（3）新型**迭代提示机制（iterative prompting mechanism）**，结合环境反馈、执行错误和自我验证，改进生成程序。\n\
    \nVOYAGER 以黑箱查询方式与 GPT-4 交互，不需要对模型参数进行微调。其学习的技能具有跨越多个时间步、可解释、可组合等特征，因而能够快速累积能力并缓解传统持续学习方法中的**灾难性遗忘（catastrophic\
    \ forgetting）**。实验表明，VOYAGER 在 Minecraft 中展现了强大的**上下文内终身学习（in-context lifelong learning）**能力：比以往先进方法获得 **3.3倍**的不同物品、探索距离延长\
    \ **2.3倍**，解锁技术树关键里程碑的速度最快达到 **15.3倍**。此外，它还能把旧世界获得的技能库迁移至新的 Minecraft 世界，从零完成新任务，而对照方法难以实现有效泛化。\n\n![图1：物品探索进展](./images/figure-01.png)\n\
    \n**图1　VOYAGER 通过自主探索持续发现"
