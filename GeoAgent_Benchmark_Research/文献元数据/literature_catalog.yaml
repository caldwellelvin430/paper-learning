  translation_scope_evidence: "# 对基准进行基准测试：工具调用评估的有效性审计\n\n**英文题名**：Benchmarking the Benchmarks: A Validity Audit\
    \ of Tool-Calling Evaluation  \n**作者**：Jay Vaghasiya、Vishvesh Bhat、Muhammad Ahmed Mohsin、Asad Aali  \n**机构**：CoreThink\
    \ AI；斯坦福大学（Stanford University）  \n**原稿**：arXiv:2607.02577v1，2026 年 6 月 30 日，预印本  \n**中文处理说明**：按照原稿章节顺序译述正文与附录；保留原表、模型名、工具名及公式；英文原文另见\
    \ `英文原文_逐页.md`。表中数值未重新估计。\n\n## 摘要\n\n工具调用基准测试日益用于对语言模型智能体进行排名，但人们往往将这些基准产生的分数视为真实标准（ground truth），却没有验证评价器本身。本文对四类重要工具调用基准——BFCL\
    \ v4、τ²-Bench、LiveMCPBench 和 MCP-Atlas——进行了系统性的有效性与可复现性审计。在由专家复核的 496 个基准任务中，发现 92 个自动评价结果与人工判断不一致的案例，即 18.5%\
    \ 的不一致率。这些失败并非孤立的标注错误：确定性基准存在脆弱的状态匹配、对单一路径的锁定、错误的标准答案、基于子字符串的沟通检测失败、奖励依据与任务目标不一致等问题；使用大语言模型裁判的基准则存在评分细则漂移、凭空认定任务完成、只看答案的评分方式，以及较大的重复运行方差。在\
    \ LiveMCPBench 中，针对同一配置重复评价 23 次所得分数从 57.9% 到 76.8% 不等，相差 18.9 个百分点，足以改变排行榜结论。结果说明，当前工具调用分数可能反映的是评价器的伪差，而非智能体的真实能力。为此，论文提出统一的评价失败分类体系，发布轨迹级审计产物及经修正的评价组件，并倡导分别测量工具调用、任务完成和结果核验三个维度。研究认为，工具使用智能体的发展需要其基准评价器本身具备可复现性、可审计性，并与人工任务成功判断一致。论文进一步提出\
    \ Tool-Veritas，一种以确定性状态校验配合可选定性裁判的可配置基准，以及 Harness Lab，一个用于基准执行、轨迹检查、重复运行比较和评价器调试的开源系统。\n\n## 1 引言\n\n工具调用已成为现代语言模型智能体的核心能力，使其能够与外部\
    \ API、数据库、操作系统、Web 服务和企业工具交互。因此，以基准测试为依据的评估，成为衡量进展、比较模型并指导部署的主要手段。BFCL、τ-bench、τ²-Bench、LiveMCPBench 和 MCP-Atlas\
    \ 等基准被广泛作为函数调用、有状态交互和大规模工具使用评估的标准参照"
