  translation_scope_evidence: "# 通过层次化任务抽象机制设计领域专用智能体\n\n**英文题名：** Designing Domain-Specific Agents via Hierarchical\
    \ Task Abstraction Mechanism  \n**作者：** Kaiyu Li, Jiayu Wang, Zhi Wang, Hui Qiao, Weizhan Zhang, Deyu Meng,\
    \ Xiangyong Cao  \n**机构：** 西安交通大学；中国电信陕西分公司  \n**预印本：** arXiv:2511.17198v1（2025 年 11 月 21 日）  \n**项目：** https://earth-insights.github.io/EarthAgent\
    \  \n**通讯作者：** Xiangyong Cao（caoxiangyong@mail.xjtu.edu.cn）\n\n> 本文提出的 **EarthAgent** 与另一篇《Earth-Agent: Unlocking\
    \ the Full Landscape of Earth Observation with Agents》是不同的系统，作者在原论文补充材料第12节专门解释同名差异。**HTAM** = Hierarchical\
    \ Task Abstraction Mechanism（层次化任务抽象机制）；**GeoPlan-bench** 是本文用于规划能力比较的基准；全文“工具调用路径”不等同于真实工具执行轨迹。\n\n## 摘要\n\n\
    由大语言模型驱动的智能体，尤其是采用 ReAct 等通用框架或模拟人类社会角色协作的架构，在需要严格结构化流程的专门领域往往表现不佳。例如遥感分析既需要辐射校正、光谱指数计算等专业工具，也涉及多个中间产物、可选步骤和复杂的先后次序，对通用智能体提出很大挑战。为弥合这一差距，作者提出以**层次化任务抽象机制（HTAM）**为核心的新型智能体设计框架。HTAM\
    \ 不再按照人类职业角色组织协作，而是依据目标领域本身的任务依赖图，将多智能体组织为符合问题求解逻辑的层级架构。复杂问题被拆为若干依次衔接的功能层，上层依赖下层处理结果，从结构上约束过程正确性。\n\n作者将该方法实现为面向复杂地理空间分析的多智能体系统\
    \ **EarthAgent**，并提出 **GeoPlan-bench**，以真实的多步骤地理空间规划问题检验智能体对任务的分解与规划能力。论文设计了工具选择正确性、路径结构相似度和逻辑完整性等多维指标，比较了多种单智能体与多智能体架构。结果显示，EarthAgent\
    \ 在多个评测维度上显著优于基线系统。研究强调：**让智能体架构与专业领域固有的任务结构相匹配，是构建稳健、可靠的专用自治系统的重要条件**。\n\n## 1 引言\n\n近年来，大语言模型在推理、规划和工具交互方面的进步推动了自治智能"
