  translation_scope_evidence: "# 注意力机制就是你所需要的一切\n\n> **原题**：Attention Is All You Need  \n> **作者**：Ashish Vaswani、Noam\
    \ Shazeer、Niki Parmar、Jakob Uszkoreit、Llion Jones、Aidan N. Gomez、Łukasz Kaiser、Illia Polosukhin  \n> **发表**：第\
    \ 31 届神经信息处理系统大会（NIPS 2017）  \n> **阅读说明**：按原文的章节与段落顺序翻译；公式、参数、模型名和文献编号保持原样；图表为原 PDF 截图。文末参考文献保留英文书目信息，避免改动可检索的正式题名。\n\
    \n## 摘要（原稿第 1 页）\n\n当前主流的序列转换模型建立在复杂的循环神经网络或卷积神经网络之上，并采用编码器—解码器结构。性能最好的模型通常还通过注意力机制连接编码器和解码器。我们提出了一种全新的、结构简单的网络架构——**Transformer**，它完全基于注意力机制，不再使用循环结构和卷积。我们在两项机器翻译任务上的实验表明，该模型在翻译质量上优于已有模型，同时具有更强的并行计算能力，所需训练时间显著缩短。在\
    \ WMT 2014 英译德任务上，我们的模型取得 **28.4 BLEU**，比包括集成系统在内的原最佳结果高出超过 2 BLEU。在 WMT 2014 英译法任务上，我们仅使用 8 块 GPU 训练 3.5 天，就取得了当时单模型最佳的\
    \ **41.0 BLEU**，训练成本远低于文献中表现最好的模型。\n\n## 1 引言（原稿第 1–2 页）\n\n循环神经网络，尤其是长短期记忆网络（LSTM）[12]和门控循环神经网络[7]，已成为语言建模和机器翻译等序列建模、序列转换问题中的先进方法[29,2,5]。研究者持续探索循环语言模型与编码器—解码器架构的性能极限[31,21,13]。\n\
    \n循环模型通常沿输入、输出序列的符号位置组织计算：在时刻 $t$，根据前一隐藏状态 $h_{t-1}$ 和当前位置的输入生成隐藏状态 $h_t$。这种固有的顺序性使训练样本内部难以并行计算；当序列很长、内存限制了跨样本批处理规模时，这一问题尤为突出。近期研究借助因式分解技术[18]和条件计算[26]显著提升了计算效率，后者还改善了模型表现，但顺序计算这一根本限制依然存在。\n\
    \n注意力机制已成为许多序列建模和序列转换任务的重要组成部分，使模型能够捕捉输入或输出序列中不同位置间的依赖关系，而不受它们之间距离的限制[2,16]。然而，除少数例外[22]，注意力机制通常仍与循环网络共同使用。\n\
    \n我们提出的 Transformer 架构摒弃循环计算，完全通过注意力机制建立输入和输出之间的全局依赖关系。Transformer 大幅提升了并行化能力，只需在 8 块 P100 GPU 上训练"
