    \ 页；本译稿以提供的原版 PDF 为依据。\n\n> **翻译与核查标记**：本文对摘要及正文第 1—9 节、关键数值与评估方法作了中文译述；附录 K 的 46 项标准逐项译出名称并给出含义，附录 J 的使用方法也已整理。51\
