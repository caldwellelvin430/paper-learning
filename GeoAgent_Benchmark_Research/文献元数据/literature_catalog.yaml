  translation_scope_evidence: "# 当智能体评价变得不可靠：评估预言机故障与配置依赖测量的实证研究\n\n**原文题名**：*When Agent Evaluation Becomes Unreliable:\
    \ An Empirical Study of Oracle Failures and Configuration-Dependent Measurement in an LLM Agent Benchmark* \
    \ \n**作者**：Junjie Chen  \n**机构**：南京理工大学计算机科学与工程学院  \n**版本**：arXiv:2610.16067v2，2026 年 10 月 21 日；原始 PDF 共 29\
    \ 页。\n\n> **译文范围**：摘要、引言的研究问题与贡献、核心审计方法、主要结果、讨论及威胁已译成中文或作忠实分节译述。参考文献、部分表格的逐行细节和重复性材料未全部逐句翻译，仍在 `英文原文_逐页完整提取.md`\
    \ 与原稿截图中保留。作者对哪些结果能够得到因果解释设置了很严格的界限，以下不扩大其结论。\n\n## 摘要（中文翻译）\n\n智能体评价框架（evaluation harness）本身是软件：它运行测试集、驱动测试输入生成器，并依靠测试预言机（test\
    \ oracle）判定结果。本文审计这些软件中无法从分数表看出的缺陷。\n\n首先，作者提出一种系统性的预言机完整性审计方法，包括 **五项状态完整性不变量**和**三项已知答案对照测试**，并通过在两个任务领域和一个合成领域注入七类预言机缺陷加以验证。所有缺陷类别均能够被发现，在\
    \ **57 个可区分的变体—测试目标组合中检出 54 个**；修复后的预言机没有出现误报。在一个常用智能体基准中，方法发现奖励函数在构造 Ground Truth 哈希时会重置数据库，却没有恢复原始状态，因此后续评分程序读取的可能是参考答案对应的状态，而不是智能体留下的状态。在\
    \ **4,320 次实验**中，归档标签记录了 **4,194 次**数据库部分判定通过，重新回放得到 **2,883 次**，总体成功率由 **94.3%** 降至 **65.5%**。这种修正并非简单的统一偏移：各智能体分数减少约\
    \ **24–34 个百分点**，被认为最强的智能体也发生变化。\n\n其次，证据强度较弱的分析显示，评价装置的语言本地化是测量过程中的一个属性。涉及 **3,240 次实验**的消融研究发现，在所测试的配置下，分别本地化三种文档中的任何一种，都与智能体轨迹退化比例降低有关，但不能确定三者的因果排序；在第二个任务领域，语言效应的方向发生逆转。\n\
    \n最后，这套方法未能直接迁移到第二个独立实现的基准。作者明确指出方法迁移所要求的软件接口契约，并发布了可在离线环境中重新计算全部分析结果、无需模型调用的复现包。\n\n**关键词**：测试预言机；不稳定测试；测量效度；基准质量"
